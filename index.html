        </div>
        ${blastResult?html`<div style=${{padding:'6px 10px',borderRadius:6,background:blastResult.ok?`${C.ok}12`:`${C.er}12`,color:blastResult.ok?C.ok:C.er,fontSize:11}}>${blastResult.ok?'✓ ':'✗ '}${blastResult.msg}</div>`:''}
        ${testSendBox}
      </div>`:''}
      ${ca.status==='skipped'?html`<div style=${{marginTop:14,paddingTop:14,borderTop:`0.5px solid ${C.bd}`,display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
        <span style=${{color:C.er,fontSize:12}}>✗ Skipped — will not send</span>
        <button onClick=${doReopen} disabled=${busy} style=${{background:'transparent',color:C.dm,border:`0.5px solid ${C.bd}`,borderRadius:6,padding:'5px 12px',fontSize:11,cursor:'pointer'}}>Restore</button>
        ${onDelete&&html`<button onClick=${()=>{if(confirm('Permanently DELETE this rejected email from the database?\n\nThis cannot be undone.'))onDelete(ca.id);}} style=${{background:'transparent',color:C.er,border:`0.5px solid ${C.er}45`,borderRadius:6,padding:'5px 12px',fontSize:11,cursor:'pointer'}}>🗑️ Delete</button>`}
      </div>`:''}
    </div>
    ${previewDoc?html`<div onClick=${()=>setPreviewDoc(null)} style=${{position:'fixed',inset:0,background:'rgba(0,0,0,0.72)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
      <div onClick=${e=>e.stopPropagation()} style=${{background:'#fff',borderRadius:10,width:'100%',maxWidth:680,height:'85vh',display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <div style=${{padding:'10px 16px',background:C.s1,display:'flex',justifyContent:'space-between',alignItems:'center',gap:10,flexShrink:0}}>
          <span style=${{color:C.tx,fontSize:13,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>👁 ${previewDoc.subject}</span>
          <button onClick=${()=>setPreviewDoc(null)} style=${{background:'transparent',color:C.dm,border:`0.5px solid ${C.bd}`,borderRadius:6,padding:'4px 12px',fontSize:12,cursor:'pointer',flexShrink:0}}>✕ Close</button>
        </div>
        <iframe srcDoc=${previewDoc.html} sandbox="" style=${{flex:1,border:'none',width:'100%',background:'#f4f4f4'}} title="Email preview"/>
      </div>
    </div>`:''}
  </div>`;
}

// ── DEPLOYMENT TAB ────────────────────────────────────────────
function DeploymentTab({deployments,clients}){
  const[l1,setL1]=useState('all');
  const[l2,setL2]=useState('all');
  const[filterClient,setFilterClient]=useState('all');
  const[firingRows,setFiringRows]=useState({});
  const[fireResults,setFireResults]=useState({});
  const{approvals,assets}=deployments;

  const FIRE_WEBHOOK={email:'email-blast-run',social:'social-sync-run',real_gains:'real-gains-run'};
  async function fireRow(row){
    if(firingRows[row.id])return;
    const wh=FIRE_WEBHOOK[row.content_type];
    if(!wh){alert('No webhook configured for this content type.');return;}
    if(!confirm(`Fire ${row.meta?.label||row.content_type} Wk${row.week_number} now?\n\nThis will immediately publish to the live channel. Check Telegram for confirmation.`))return;
    setFiringRows(p=>({...p,[row.id]:true}));
    setFireResults(p=>({...p,[row.id]:null}));
    fetch(`${N8N}/webhook/${wh}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({weekOverride:row.week_number,source:'app4_deployments'})}).catch(()=>{});
    setFireResults(p=>({...p,[row.id]:{ok:true}}));
    setFiringRows(p=>({...p,[row.id]:false}));
  }
  const now=new Date();
  const fmtShort=d=>d?new Date(d).toLocaleDateString('en-MY',{day:'numeric',month:'short',...MYT}):'—';

  // Build unified rows from content_approvals
  const allRows=approvals.map(ca=>{
    const m=CAMPAIGN_META[ca.content_type]||{icon:'📄',label:ca.content_type,campaign:ca.content_type,channel:'',color:'#5a8ab0'};
    const linkedAsset=assets.find(a=>a.id===ca.full_content?.asset_id);
    const schDate=ca.scheduled_for?new Date(ca.scheduled_for):null;
    const isPast=schDate&&schDate<now;
    const daysUntil=schDate?Math.ceil((schDate-now)/86400000):null;
    const isPublished=ca.status==='published';
    const isSkipped=ca.status==='skipped';
    const isApproved=ca.status==='approved';
    // Clean title from new naming convention
    const title=(ca.subject||'').replace(/^(TDOW (Email|Social) Wk\d+:|Real Gains Wk\d+:)\s*/i,'').replace(/^[🏓📧📸]+\s*/,'');
    return{
      id:ca.id,content_type:ca.content_type,week_number:ca.week_number,title,
      meta:m,channel:m.channel,campaign:m.campaign,
      scheduled_for:ca.scheduled_for,approved_at:ca.approved_at,
      status:isPublished?'published':isSkipped?'skipped':isApproved?'approved':'pending',
      platform_post_id:linkedAsset?.platform_post_id||null,
      deployment_error:linkedAsset?.deployment_error||null,
      client_id:linkedAsset?.client_id||null,
      isPast,daysUntil
    };
  }).sort((a,b)=>new Date(a.scheduled_for)-new Date(b.scheduled_for));

  const ctFilter=resolveCtFilter(l1,l2);
  const matchesDep=r=>ctFilter==='all'?true:ctFilter==='tdow'?(r.content_type==='email'||r.content_type==='social'):r.content_type===ctFilter;
  const filtered=allRows.filter(r=>matchesDep(r)&&(filterClient==='all'||r.client_id===filterClient));

  const publishedCount=allRows.filter(r=>r.status==='published').length;
  const scheduledCount=allRows.filter(r=>r.status==='approved').length;
  const failedCount=allRows.filter(r=>r.deployment_error).length;

  const caIds=new Set(approvals.map(ca=>ca.full_content?.asset_id).filter(Boolean));
  const standaloneAssets=assets.filter(a=>!caIds.has(a.id)&&a.status==='published');

  function FireBtn({row}){
    const isFiring=!!firingRows[row.id];
    const result=fireResults[row.id];
    if(result?.ok)return html`<span style=${{color:'#34d399',fontSize:10}}>✓ Triggered</span>`;
    return html`<button onClick=${()=>fireRow(row)} disabled=${isFiring}
      style=${{marginTop:3,background:'rgba(74,134,245,0.12)',color:'#4a86f5',border:'0.5px solid rgba(74,134,245,0.4)',borderRadius:5,padding:'3px 8px',fontSize:10,fontWeight:700,cursor:isFiring?'default':'pointer',opacity:isFiring?0.6:1,display:'block'}}>
      ${isFiring?'⏳…':'🚀 Fire Now'}
    </button>`;
  }

  function StatusCell({row}){
    const canFire=FIRE_WEBHOOK[row.content_type]&&row.status!=='published'&&row.status!=='skipped';
    if(row.deployment_error)return html`<div>
      <span style=${{color:'#f87171',fontWeight:700,fontSize:11}}>❌ Failed</span>
      <div style=${{color:'#f87171',fontSize:10,marginTop:2,maxWidth:180,wordBreak:'break-word'}}>${row.deployment_error}</div>
      ${canFire&&html`<${FireBtn} row=${row}/>`}
    </div>`;
    if(row.status==='published')return html`<span style=${{color:'#34d399',fontWeight:700,fontSize:11}}>✓ Published</span>`;
    if(row.status==='skipped')return html`<span style=${{color:'#5a8ab0',fontSize:11}}>⏭ Skipped</span>`;
    if(row.isPast)return html`<div>
      <span style=${{color:'#f87171',fontSize:11}}>⚠ Overdue</span>
      ${canFire&&html`<${FireBtn} row=${row}/>`}
    </div>`;
    if(row.daysUntil!==null&&row.daysUntil<=1)return html`<div>
      <span style=${{color:'#fbbf24',fontWeight:700,fontSize:11}}>⚡ Tomorrow</span>
      ${canFire&&html`<${FireBtn} row=${row}/>`}
    </div>`;
    if(row.daysUntil!==null&&row.daysUntil<=3)return html`<div>
      <span style=${{color:'#fbbf24',fontSize:11}}>⚡ In ${row.daysUntil}d</span>
    </div>`;
    return html`<span style=${{color:'#4a86f5',fontSize:11}}>📅 Scheduled</span>`;
  }

  return html`<div>
    <!-- Client filter -->
    <div style=${{display:'flex',alignItems:'center',gap:10,marginBottom:18}}>
      <label style=${{color:'#5a8ab0',fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.5px',whiteSpace:'nowrap'}}>Client</label>
      <select value=${filterClient} onChange=${e=>setFilterClient(e.target.value)}
        style=${{background:'#0a1020',color:'#c8d8e8',border:'0.5px solid #17304e',borderRadius:8,padding:'7px 12px',fontSize:13,flex:1,maxWidth:260}}>
        <option value="all">All Clients</option>
        ${(clients||[]).map(c=>html`<option key=${c.id} value=${c.id}>${c.basics?.brandName||c.basics?.clientName||c.id}</option>`)}
      </select>
    </div>
    <!-- Level 1: Campaign -->
    <div style=${{marginBottom:8,color:'#5a8ab0',fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'1px'}}>Campaign</div>
    <div style=${{display:'flex',gap:6,marginBottom:12,flexWrap:'wrap'}}>
      ${CAMP_L1.map(({k,l,color})=>{
        const cnt=k==='all'?allRows.length:k==='tdow'
          ?allRows.filter(r=>r.content_type==='email'||r.content_type==='social').length
          :allRows.filter(r=>r.content_type===k).length;
        const active=l1===k;
        return html`<button key=${k} onClick=${()=>{setL1(k);setL2('all');}} style=${{
          background:active?color+'22':'#0a1020',color:active?color:'#5a8ab0',
          border:`0.5px solid ${active?color+'55':'#17304e'}`,
          borderRadius:20,padding:'6px 16px',fontSize:13,fontWeight:active?700:500,cursor:'pointer'
        }}>${l} <span style=${{opacity:0.6,fontSize:11}}>(${cnt})</span></button>`;
      })}
    </div>
    <!-- Level 2: Channel -->
    ${l1!=='all'&&CAMP_L2[l1]&&html`<div style=${{marginBottom:16}}>
      <div style=${{marginBottom:8,color:'#5a8ab0',fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'1px'}}>Channel</div>
      <div style=${{display:'flex',gap:6,flexWrap:'wrap'}}>
        ${CAMP_L2[l1].map(({k,l,color,ct})=>{
          const cnt=ct?allRows.filter(r=>r.content_type===ct).length
            :allRows.filter(r=>r.content_type==='email'||r.content_type==='social').length;
          const active=l2===k;
          return html`<button key=${k} onClick=${()=>setL2(k)} style=${{
            background:active?color+'22':'#0a1020',color:active?color:'#5a8ab0',
            border:`0.5px solid ${active?color+'55':'#17304e'}`,
            borderRadius:20,padding:'5px 14px',fontSize:12,fontWeight:active?700:400,cursor:'pointer'
          }}>${l} <span style=${{opacity:0.6,fontSize:11}}>(${cnt})</span></button>`;
        })}
      </div>
    </div>`}

    <!-- Summary chips -->
    <div style=${{display:'flex',gap:10,marginBottom:16,flexWrap:'wrap'}}>
      ${[{l:'✓ Published',n:publishedCount,c:'#34d399'},{l:'📅 Scheduled',n:scheduledCount,c:'#4a86f5'},{l:'❌ Failed',n:failedCount,c:'#f87171'},{l:'Total',n:allRows.length,c:'#5a8ab0'}]
        .map(({l,n,c})=>html`<div style=${{background:'#0a1020',border:`0.5px solid ${c}25`,borderRadius:8,padding:'8px 14px',flex:1,minWidth:110,textAlign:'center'}}>
          <div style=${{fontSize:20,fontWeight:800,color:c}}>${n}</div>
          <div style=${{fontSize:10,color:'#5a8ab0',marginTop:1}}>${l}</div>
        </div>`)}
    </div>

    <!-- Table -->
    <div style=${{background:'#0a1020',border:'0.5px solid #17304e',borderRadius:10,overflow:'hidden'}}>
      <div style=${{display:'grid',gridTemplateColumns:'28px 120px 1fr 90px 100px 90px 115px',background:'#0e1830',borderBottom:'0.5px solid #17304e',padding:'9px 14px',fontSize:10,fontWeight:700,color:'#5a8ab0',textTransform:'uppercase',letterSpacing:'0.5px'}}>
        <div>#</div><div>Campaign</div><div>Post Title</div><div>Week</div><div>Scheduled</div><div>Approved</div><div>Status</div>
      </div>

      ${filtered.length===0&&html`<div style=${{textAlign:'center',padding:'50px 20px',color:'#274466'}}>
        <div style=${{fontSize:24,marginBottom:8}}>🚀</div><div>No content for this campaign yet.</div>
      </div>`}

      ${filtered.map((row,i)=>{
        const isPublished=row.status==='published';
        const hasError=!!row.deployment_error;
        return html`<div key=${row.id} style=${{
          display:'grid',gridTemplateColumns:'28px 120px 1fr 90px 100px 90px 115px',
          padding:'10px 14px',borderBottom:'0.5px solid #0d1a2e',
          background:hasError?'rgba(248,113,113,0.06)':isPublished?'rgba(52,211,153,0.03)':i%2?'rgba(14,24,48,0.35)':'transparent',
          alignItems:'center'
        }}>
          <div style=${{color:'#1a3055',fontSize:10}}>${i+1}</div>
          <div>
            <span style=${{background:row.meta.color+'18',color:row.meta.color,borderRadius:8,padding:'2px 7px',fontSize:10,fontWeight:700}}>
              ${row.meta.icon} ${row.meta.label}
            </span>
            <div style=${{color:'#274466',fontSize:9,marginTop:2}}>${row.channel}</div>
          </div>
          <div>
            <div style=${{color:'#cfe0f5',fontSize:12,fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>${row.title.slice(0,50)||'—'}</div>
            ${row.platform_post_id?html`<div style=${{color:'#34d399',fontSize:9,marginTop:1}}>ID: ${row.platform_post_id}</div>`:''}
          </div>
          <div style=${{color:'#4a86f5',fontWeight:700,fontSize:12}}>Wk ${row.week_number||'—'}</div>
          <div style=${{color:'#5a8ab0',fontSize:11}}>${fmtShort(row.scheduled_for)}</div>
          <div style=${{color:'#274466',fontSize:10}}>${fmtShort(row.approved_at)}</div>
          <div><${StatusCell} row=${row}/></div>
        </div>`;
      })}
    </div>

    ${standaloneAssets.length>0&&html`<div style=${{marginTop:20}}>
      <div style=${{marginBottom:6,color:'#5a8ab0',fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:'1px'}}>Other Published Assets</div>
      ${standaloneAssets.map(a=>html`<div key=${a.id} style=${{background:'#0a1020',border:'0.5px solid #13213e',borderRadius:8,padding:'9px 14px',marginBottom:4,display:'flex',justifyContent:'space-between',alignItems:'center',gap:12,flexWrap:'wrap'}}>
        <div>
          <div style=${{color:'#cfe0f5',fontSize:12,fontWeight:500}}>${a.asset_name||a.campaign_id}</div>
          <div style=${{color:'#274466',fontSize:10}}>${a.campaign_name} · ${a.channel} · v${a.variant_label||'A'}</div>
        </div>
        <div style=${{display:'flex',gap:6,alignItems:'center'}}>
          ${a.deployment_error?html`<span style=${{color:'#f87171',fontSize:11}}>❌ ${a.deployment_error.slice(0,50)}</span>`:html`<span style=${{color:'#34d399',fontWeight:700,fontSize:12}}>✓ Published</span>`}
        </div>
      </div>`)}
    </div>`}
  </div>`;
}

// ── SHARED CONSTANTS ─────────────────────────────────────────
const CA_STATUS_MAP={
  pending:     {l:'Pending Approval',c:'#fbbf24',icon:'⏳'},
  approved:    {l:'Approved',        c:'#34d399',icon:'✓'},
  published:   {l:'Published',       c:'#2dd4bf',icon:'🚀'},
  skipped:     {l:'Skipped',         c:'#f87171',icon:'✗'},
  revision_requested:{l:'Revision',  c:'#a78bfa',icon:'✏️'},
  awaiting_revision: {l:'In Revision',c:'#a78bfa',icon:'✏️'},
  held:        {l:'On Hold',         c:'#5a8ab0',icon:'⏸'},
};
const CAMPAIGN_META={
  email:      {icon:'📧',label:'TDOW Email',     campaign:'TDOW Email Series',        channel:'📧 Email Blast',            color:'#4a86f5'},
  social:     {icon:'📸',label:'TDOW Social',    campaign:'TDOW Social Series',       channel:'📸 Instagram · 📘 Facebook', color:'#fb923c'},
  real_gains: {icon:'🏓',label:'Real Gains',     campaign:'Real Gains w/ Titan',      channel:'📸 Instagram · 📘 Facebook', color:'#2dd4bf'},
};
// Two-level campaign filter config
const CAMP_L1=[
  {k:'all',        l:'All Campaigns', color:'#4a86f5'},
  {k:'tdow',       l:'TDOW',          color:'#fb923c', desc:'Titan Drill of the Week'},
  {k:'real_gains', l:'Real Gains',    color:'#2dd4bf', desc:'Real Gains w/ Titan'},
];
const CAMP_L2={
  tdow:[
    {k:'all',    l:'All TDOW',         color:'#fb923c'},
    {k:'email',  l:'📧 Email',          color:'#4a86f5', ct:'email'},
    {k:'social', l:'📸 IG  📘 FB', color:'#fb923c', ct:'social'},
  ],
  real_gains:[
    {k:'all', l:'📸 IG  📘 FB', color:'#2dd4bf', ct:'real_gains'},
  ],
};
// Map l1+l2 → content_type filter
function resolveCtFilter(l1,l2){
  if(l1==='all')return'all';
  if(l1==='real_gains')return'real_gains';
  if(l1==='tdow'){
    if(l2==='email')return'email';
    if(l2==='social')return'social';
    return'tdow'; // both email+social
  }
  return'all';
}
const SCHED_CAMPAIGNS=[
  {k:'all',        l:'All Active Campaigns', color:'#4a86f5'},
  {k:'email',      l:'Email (all series)', icon:'📧', color:'#4a86f5'},
  {k:'social',     l:'TDOW Social',   icon:'📸', color:'#fb923c'},
  {k:'real_gains', l:'Real Gains',    icon:'🏓', color:'#2dd4bf'},
];

// ── ARCHIVE TAB ──────────────────────────────────────────────
function ArchiveTab({archive,onPurge}){
  const[filterCt,setFilterCt]=useState('all');
  const filtered=filterCt==='all'?archive:archive.filter(r=>r.content_type===filterCt);

  // Group by campaign_id then sort within each group by published_at desc
  const groups={};
  filtered.forEach(r=>{
    const key=r.campaign_id||'unknown';
    if(!groups[key])groups[key]=[];
    groups[key].push(r);
  });

  const ctChips=[
    {k:'all',l:'All Campaigns',color:'#4a86f5'},
    {k:'real_gains',l:'🏓 Real Gains',color:'#2dd4bf'},
    {k:'social',l:'📸📘 TDOW Social',color:'#fb923c'},
    {k:'email',l:'📧 Email (all series)',color:'#4a86f5'},
  ];
  const campaignLabel=r=>r.campaign_name||CAMPAIGN_META[r.content_type]?.campaign||r.campaign_id||'Unknown Campaign';
  const campaignColor=r=>CAMPAIGN_META[r.content_type]?.color||'#5a8ab0';

  if(!archive.length)return html`<div style=${{textAlign:'center',padding:'80px 20px',color:'#274466'}}>
    <div style=${{fontSize:32,marginBottom:12}}>📦</div>
    <div style=${{fontSize:15,marginBottom:6,color:'#5a8ab0'}}>No archived content yet.</div>
    <div style=${{fontSize:12,color:'#1a3055'}}>Published assets you archive will appear here, organized by campaign and publish date.</div>
  </div>`;

  return html`<div>
    <!-- Filter chips -->
    <div style=${{display:'flex',gap:6,flexWrap:'wrap',marginBottom:20}}>
      ${ctChips.map(({k,l,color})=>{
        const cnt=k==='all'?archive.length:archive.filter(r=>r.content_type===k).length;
        const active=filterCt===k;
        return html`<button key=${k} onClick=${()=>setFilterCt(k)} style=${{
          background:active?color+'22':'#0a1020',color:active?color:'#5a8ab0',
          border:`0.5px solid ${active?color+'55':'#17304e'}`,
          borderRadius:20,padding:'6px 16px',fontSize:13,fontWeight:active?700:500,cursor:'pointer'
        }}>${l} <span style=${{opacity:0.6,fontSize:11}}>(${cnt})</span></button>`;
      })}
    </div>

    <!-- Summary strip -->
    <div style=${{background:'#0a1020',border:'0.5px solid #17304e',borderRadius:8,padding:'10px 16px',marginBottom:20,display:'flex',gap:24,alignItems:'center'}}>
      <div><span style=${{fontSize:20,fontWeight:800,color:'#2dd4bf'}}>${archive.length}</span><span style=${{fontSize:11,color:'#5a8ab0',marginLeft:6}}>total archived</span></div>
      <div><span style=${{fontSize:20,fontWeight:800,color:'#4a86f5'}}>${Object.keys(groups).length}</span><span style=${{fontSize:11,color:'#5a8ab0',marginLeft:6}}>campaigns</span></div>
      <div style=${{marginLeft:'auto',fontSize:11,color:'#274466'}}>Asset URLs preserved · Full content snapshot saved</div>
    </div>

    <!-- Campaign groups -->
    ${Object.entries(groups).map(([campaignId,rows])=>{
      const sample=rows[0];
      const cLabel=campaignLabel(sample);
      const cColor=campaignColor(sample);
      return html`<div key=${campaignId} style=${{marginBottom:28}}>
        <!-- Campaign header -->
        <div style=${{display:'flex',alignItems:'center',gap:10,marginBottom:12,paddingBottom:8,borderBottom:`0.5px solid #17304e`}}>
          <span style=${{background:cColor+'18',color:cColor,borderRadius:6,padding:'3px 10px',fontSize:12,fontWeight:700}}>${cLabel}</span>
          <span style=${{color:'#274466',fontSize:11}}>${rows.length} post${rows.length!==1?'s':''}</span>
        </div>
        <!-- Posts grid -->
        <div style=${{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:12}}>
          ${rows.map(row=>html`<div key=${row.id} style=${{background:'#0a1020',border:'0.5px solid #17304e',borderRadius:10,overflow:'hidden'}}>
            ${row.asset_url&&html`<div style=${{height:140,overflow:'hidden',background:'#05080f'}}>
              <img src=${row.asset_url} style=${{width:'100%',height:'100%',objectFit:'cover'}} onError=${e=>e.target.style.display='none'} />
            </div>`}
            <div style=${{padding:12}}>
              <div style=${{fontSize:12,fontWeight:700,color:'#c8d8e8',marginBottom:4,lineHeight:1.3}}>${row.title||'Untitled'}</div>
              ${row.week_number?html`<div style=${{fontSize:10,color:'#5a8ab0',marginBottom:4}}>Week ${row.week_number}</div>`:''}
              <div style=${{fontSize:10,color:'#274466',marginBottom:6}}>${row.channel||''}</div>
              ${row.copy_body?html`<div style=${{fontSize:11,color:'#5a8ab0',lineHeight:1.5,marginBottom:8,maxHeight:60,overflow:'hidden',display:'-webkit-box',WebkitLineClamp:3,WebkitBoxOrient:'vertical'}}>${row.copy_body}</div>`:''}
              <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',borderTop:'0.5px solid #0d1a2e',paddingTop:8,marginTop:4}}>
                <div>
                  <div style=${{fontSize:11,fontWeight:700,color:'#34d399'}}>🚀 ${fmtDay(row.published_at)}</div>
                  <div style=${{fontSize:9,color:'#274466',marginTop:1}}>Archived ${fmtShortGlobal(row.archived_at)}</div>
                </div>
                ${onPurge&&html`<button onClick=${()=>onPurge(row)} title="Permanently remove this archive record" style=${{background:'transparent',color:'#f87171',border:'0.5px solid rgba(248,113,113,0.3)',borderRadius:6,padding:'4px 10px',fontSize:11,cursor:'pointer'}}>🗑 Purge</button>`}
              </div>
            </div>
          </div>`)}
        </div>
      </div>`;
    })}
  </div>`;
}

// ── SCHEDULE TAB ─────────────────────────────────────────────
function ScheduleTab({schedule,clients,schedClientMap}){
  const[l1,setL1]=useState('all');
  const[l2,setL2]=useState('all');
  const[filterClient,setFilterClient]=useState('all');
  const[firingRows,setFiringRows]=useState({});
  const[fireResults,setFireResults]=useState({});
  const now=new Date();
  const daysAway=d=>Math.ceil((new Date(d)-now)/(1000*60*60*24));
  const FIRE_HOOKS={email:'email-blast-run',social:'social-sync-run',real_gains:'real-gains-run'};
  async function fireRow(item){
    if(firingRows[item.id])return;
    const wh=FIRE_HOOKS[item.content_type];
    if(!wh){alert('No webhook configured for this content type.');return;}
    const label={'email':'Email Blast','social':'Social Post','real_gains':'Real Gains Post'}[item.content_type]||item.content_type;
    if(!validateForFire(item).ok){alert("⚠️ This item has an issue and can't fire — resolve it in the Flagged Issue folder first.");return;}
    if(!confirm(`Fire ${label} Wk${item.week_number} now? It will post to the live platforms immediately.`))return;
    setFiringRows(p=>({...p,[item.id]:true}));
    fetch(`${N8N}/webhook/${wh}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ca_id:item.id,source:'app4_schedule'})}).catch(()=>{});
    setFireResults(p=>({...p,[item.id]:{ok:true}}));
    setFiringRows(p=>({...p,[item.id]:false}));
  }

  const ctFilter=resolveCtFilter(l1,l2);
  const matchesCt=s=>{
    if(ctFilter==='all')return true;
    if(ctFilter==='tdow')return s.content_type==='email'||s.content_type==='social';
    return s.content_type===ctFilter;
  };
  const matchesClient=s=>{
    if(filterClient==='all')return true;
    const cid=(schedClientMap||{})[s.id];
    if(!cid)return true; // no mapping yet → show under all clients
    return cid===filterClient;
  };

  const valid=schedule.filter(s=>s.scheduled_for);
  const filtered=valid.filter(s=>matchesCt(s)&&matchesClient(s));
  // Schedule = will-blast only: status==='approved' AND passes the integrity gate. Broken-but-approved → quarantine (wontFire).
  const upcoming=filtered.filter(s=>s.status==='approved'&&validateForFire(s).ok&&new Date(s.scheduled_for)>=now)
    .sort((a,b)=>new Date(a.scheduled_for)-new Date(b.scheduled_for));
  const wontFire=filtered.filter(s=>s.status==='approved'&&!validateForFire(s).ok)
    .sort((a,b)=>new Date(a.scheduled_for||0)-new Date(b.scheduled_for||0));
  const past=filtered.filter(s=>s.status==='published'||(s.status==='approved'&&validateForFire(s).ok&&new Date(s.scheduled_for)<now))
    .sort((a,b)=>new Date(b.scheduled_for)-new Date(a.scheduled_for));

  if(!schedule.length)return html`<div style=${{textAlign:'center',padding:'80px 20px',color:'#274466'}}>
    <div style=${{fontSize:32,marginBottom:12}}>📅</div><div>No scheduled content yet.</div>
  </div>`;

  function SchedRow({item,dim,issues}){
    const m=CAMPAIGN_META[item.content_type]||{icon:'📄',label:item.content_type,campaign:item.content_type,channel:'',color:'#5a8ab0'};
    const st=CA_STATUS_MAP[item.status]||{l:item.status,c:'#5a8ab0',icon:''};
    const da=daysAway(item.scheduled_for);
    const isUrgent=da>=0&&da<=3&&item.status==='pending';
    const title=(item.subject||'').replace(/^(TDOW (Email|Social) Wk\d+:|Real Gains Wk\d+:)\s*/i,'').replace(/^[🏓📧📸]+\s*/,'');
    return html`<div style=${{
      background:'#0a1020',
      border:`0.5px solid ${isUrgent?'rgba(251,191,36,0.45)':item.status==='approved'?'rgba(52,211,153,0.2)':'#13213e'}`,
      borderRadius:8,padding:'11px 16px',marginBottom:5,opacity:dim?0.5:1
    }}>
      <div style=${{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
        <span style=${{background:m.color+'18',color:m.color,border:`0.5px solid ${m.color}35`,borderRadius:10,padding:'2px 9px',fontSize:10,fontWeight:700,flexShrink:0}}>
          ${m.icon} ${m.campaign}
        </span>
        <span style=${{background:'rgba(255,255,255,0.04)',color:'#5a8ab0',border:'0.5px solid #17304e',borderRadius:8,padding:'2px 8px',fontSize:10,flexShrink:0}}>${m.channel}</span>
        <span style=${{color:m.color,fontWeight:800,fontSize:12,flexShrink:0}}>Wk ${item.week_number}</span>
        <span style=${{flex:1,minWidth:100,color:'#cfe0f5',fontSize:13,fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>${title.slice(0,65)}</span>
        <span style=${{color:'#5a8ab0',fontSize:11,flexShrink:0}}>
          📅 ${fmtDay(item.scheduled_for)}${da===0?' · today':da===1?' · tomorrow':da>0&&da<=7?` · in ${da}d`:da<0&&!dim?' · ⚠ overdue':''}
        </span>
        <div style=${{display:'flex',gap:5,alignItems:'center',flexShrink:0,flexWrap:'wrap'}}>
          ${isUrgent?html`<span style=${{background:'rgba(251,191,36,0.12)',color:'#fbbf24',border:'0.5px solid rgba(251,191,36,0.35)',borderRadius:10,padding:'2px 7px',fontSize:10,fontWeight:700}}>⚡ SOON</span>`:''}
          <span style=${{background:`${st.c}15`,color:st.c,border:`0.5px solid ${st.c}35`,borderRadius:20,padding:'2px 9px',fontSize:11,fontWeight:600,whiteSpace:'nowrap'}}>${st.icon} ${st.l}</span>
          ${item.status==='approved'&&!dim&&html`<button
            onClick=${e=>{e.stopPropagation();fireRow(item);}}
            disabled=${firingRows[item.id]}
            style=${{background:firingRows[item.id]?'rgba(52,211,153,0.08)':'rgba(52,211,153,0.15)',color:'#34d399',border:'0.5px solid rgba(52,211,153,0.4)',borderRadius:6,padding:'3px 10px',fontSize:11,fontWeight:700,cursor:firingRows[item.id]?'default':'pointer',whiteSpace:'nowrap'}}>
            ${firingRows[item.id]?'⏳ Firing…':'🚀 Post Now'}
          </button>`}
          ${fireResults[item.id]&&html`<span style=${{color:'#34d399',fontSize:10,whiteSpace:'nowrap'}}>✓ Triggered — watch Telegram</span>`}
        </div>
      </div>
      ${issues&&!issues.ok&&html`<div style=${{marginTop:8,paddingTop:8,borderTop:'0.5px dashed #3a2a1e',display:'flex',flexDirection:'column',gap:3}}>
        ${issues.hard.map(h=>html`<div style=${{fontSize:11,color:h.cls==='system'?'#7dd3fc':'#fbbf24'}}>${h.cls==='system'?'🛠 auto-fixing (system): ':'⚠️ needs you: '}${h.reason}</div>`)}
      </div>`}
    </div>`;
  }

  return html`<div>
    <!-- Client filter -->
    <div style=${{display:'flex',alignItems:'center',gap:10,marginBottom:18}}>
      <label style=${{color:'#5a8ab0',fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.5px',whiteSpace:'nowrap'}}>Client</label>
      <select value=${filterClient} onChange=${e=>setFilterClient(e.target.value)}
        style=${{background:'#0a1020',color:'#c8d8e8',border:'0.5px solid #17304e',borderRadius:8,padding:'7px 12px',fontSize:13,flex:1,maxWidth:260}}>
        <option value="all">All Clients</option>
        ${(clients||[]).map(c=>html`<option key=${c.id} value=${c.id}>${c.basics?.brandName||c.basics?.clientName||c.id}</option>`)}
      </select>
    </div>
    <!-- Level 1: Campaign -->
    <div style=${{marginBottom:8,color:'#5a8ab0',fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'1px'}}>Campaign</div>
    <div style=${{display:'flex',gap:6,marginBottom:12,flexWrap:'wrap'}}>
      ${CAMP_L1.map(({k,l,color,desc})=>{
        const cnt=k==='all'?valid.length:k==='tdow'
          ?valid.filter(s=>s.content_type==='email'||s.content_type==='social').length
          :valid.filter(s=>s.content_type===k).length;
        const active=l1===k;
        return html`<button key=${k} onClick=${()=>{setL1(k);setL2('all');}} style=${{
          background:active?color+'22':'#0a1020',color:active?color:'#5a8ab0',
          border:`0.5px solid ${active?color+'55':'#17304e'}`,
          borderRadius:20,padding:'6px 16px',fontSize:13,fontWeight:active?700:500,cursor:'pointer'
        }}>${l} <span style=${{opacity:0.6,fontSize:11}}>(${cnt})</span></button>`;
      })}
    </div>

    <!-- Level 2: Channel (only when a campaign is selected) -->
    ${l1!=='all'&&CAMP_L2[l1]&&html`<div>
      <div style=${{marginBottom:8,color:'#5a8ab0',fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'1px'}}>Channel</div>
      <div style=${{display:'flex',gap:6,marginBottom:16,flexWrap:'wrap'}}>
        ${CAMP_L2[l1].map(({k,l,color,ct})=>{
          const cnt=ct?valid.filter(s=>s.content_type===ct).length
            :valid.filter(s=>s.content_type==='email'||s.content_type==='social').length;
          const active=l2===k;
          return html`<button key=${k} onClick=${()=>setL2(k)} style=${{
            background:active?color+'22':'#0a1020',color:active?color:'#5a8ab0',
            border:`0.5px solid ${active?color+'55':'#17304e'}`,
            borderRadius:20,padding:'5px 14px',fontSize:12,fontWeight:active?700:400,cursor:'pointer'
          }}>${l} <span style=${{opacity:0.6,fontSize:11}}>(${cnt})</span></button>`;
        })}
      </div>
    </div>`}

    <!-- Per-campaign summary chips -->
    <div style=${{display:'flex',gap:8,marginBottom:18,flexWrap:'wrap'}}>
      ${(['email','social','real_gains']).filter(ct=>matchesCt({content_type:ct})).map(ct=>{
        const items=valid.filter(s=>s.content_type===ct);
        if(!items.length)return null;
        const m=CAMPAIGN_META[ct];
        const app=items.filter(s=>s.status==='approved'||s.status==='published').length;
        const pend=items.filter(s=>s.status==='pending').length;
        return html`<div key=${ct} style=${{background:'#0a1020',border:`0.5px solid ${m.color}28`,borderRadius:8,padding:'9px 14px',flex:1,minWidth:150}}>
          <div style=${{fontSize:12,fontWeight:700,color:'#cfe0f5',marginBottom:2}}>${m.icon} ${m.campaign}</div>
          <div style=${{fontSize:10,color:'#5a8ab0',marginBottom:3}}>${m.channel}</div>
          <div style=${{fontSize:11,color:'#5a8ab0'}}>${app}/${items.length} approved${pend>0?html` · <span style=${{color:'#fbbf24'}}>${pend} need approval</span>`:' ✓'}</div>
        </div>`;
      })}
    </div>

    <!-- Approved but WON'T fire (quarantine) -->
    ${wontFire.length>0&&html`<div style=${{marginBottom:18,background:'rgba(251,191,36,0.04)',border:'0.5px solid rgba(251,191,36,0.25)',borderRadius:10,padding:'12px 14px'}}>
      <div style=${{marginBottom:8,color:'#fbbf24',fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:'1.5px'}}>⚠️ Approved — but WON'T fire · resolve to schedule (${wontFire.length})</div>
      <div style=${{color:'#a98a4a',fontSize:11,marginBottom:10}}>These are approved but failed the integrity check, so they're held OUT of the schedule. 🛠 system issues self-heal automatically; ⚠️ items need you.</div>
      ${wontFire.map(item=>html`<${SchedRow} key=${item.id} item=${item} dim=${true} issues=${validateForFire(item)}/>`)}
    </div>`}

    <!-- Upcoming -->
    ${upcoming.length>0&&html`<div style=${{marginBottom:18}}>
      <div style=${{marginBottom:8,color:'#4a86f5',fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:'1.5px'}}>📅 Upcoming · locked to fire (${upcoming.length})</div>
      ${upcoming.map(item=>html`<${SchedRow} key=${item.id} item=${item} dim=${false}/>`)}
    </div>`}

    <!-- Sent / Published -->
    ${past.length>0&&html`<div>
      <div style=${{marginBottom:8,color:'#274466',fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:'1.5px'}}>✓ Sent / Published (${past.length})</div>
      ${past.map(item=>html`<${SchedRow} key=${item.id} item=${item} dim=${true}/>`)}
    </div>`}

    ${upcoming.length===0&&past.length===0&&html`<div style=${{textAlign:'center',padding:'60px 20px',color:'#274466'}}>
      <div style=${{fontSize:28,marginBottom:10}}>📅</div><div>No content for this filter.</div>
    </div>`}
  </div>`;
}

// ── MAIN APP ─────────────────────────────────────────────────
function App(){
  const[activeTab,setActiveTab]=useState('content');
  const[copyItems,setCopyItems]=useState([]);
  const[mediaAssets,setMediaAssets]=useState([]);
  const[clients,setClients]=useState([]);
  const[loading,setLoading]=useState(true);
  const[busy,setBusy]=useState({});
  const[filterStatus,setFilterStatus]=useState('pending_review');
  const[filterClient,setFilterClient]=useState('all');
  const[filterCampaign,setFilterCampaign]=useState('all');
  const[lastRefresh,setLastRefresh]=useState(null);
  const[schedule,setSchedule]=useState([]);
  const[rgSchedule,setRgSchedule]=useState({});
  const[deployments,setDeployments]=useState({approvals:[],assets:[]});
  const[archive,setArchive]=useState([]);
  const[schedClientMap,setSchedClientMap]=useState({});
  const[socialCAs,setSocialCAs]=useState([]);
  const[emailCAs,setEmailCAs]=useState([]);

  const loadData=useCallback(async(silent=false)=>{
    if(!silent)setLoading(true);
    const[q,c,m,sched,deps,arc,socCAs,emCAs]=await Promise.all([db.getQueue(),db.getClients(),db.getMediaAssets(),db.getContentSchedule(),db.getDeployments(),db.getArchive(),db.getSocialCAs(),db.getEmailCAs()]);
    setCopyItems(q);setClients(c);setMediaAssets(m);setSchedule(sched);setDeployments(deps);setArchive(arc);setSocialCAs(socCAs);setEmailCAs(emCAs);
    // Build week-number + scheduled_for map keyed by campaign_asset id (for Real Gains)
    const rgMap={};
    sched.filter(s=>s.content_type==='real_gains').forEach(s=>{
      if(s.full_content?.asset_id){
        const _rv=validateForFire(s); rgMap[s.full_content.asset_id]={week_number:s.week_number,scheduled_for:s.scheduled_for,ca_status:s.status,ca_id:s.id,post_caption:s.full_content?.post_caption||null,fireValid:_rv.ok,fireReasons:_rv.reasons};
      }
    });
    setRgSchedule(rgMap);
    // Build ca_id → client_id map for Schedule tab client filtering
    const caMap={};
    sched.filter(s=>s.content_type==='real_gains').forEach(s=>{
      if(s.full_content?.asset_id){
        const asset=m.find(a=>a.id===s.full_content.asset_id);
        if(asset?.client_id)caMap[s.id]=asset.client_id;
      }
    });
    setSchedClientMap(caMap);
    setLastRefresh(new Date());
    if(!silent)setLoading(false);
  },[]);

  useEffect(()=>{loadData();},[loadData]);
  useEffect(()=>{const t=setInterval(()=>loadData(true),60000);return()=>clearInterval(t);},[loadData]);

  async function handleCopyUpdate(item){
    setBusy(p=>({...p,[item.id]:true}));
    await db.updateItem(item);
    setCopyItems(prev=>prev.map(i=>i.id===item.id?item:i));
    setBusy(p=>({...p,[item.id]:false}));
  }
  async function handleCopyDelete(id){
    if(!confirm('Remove this item from the queue?'))return;
    await db.deleteItem(id);
    setCopyItems(prev=>prev.filter(i=>i.id!==id));
  }
  async function handleSocialCAUpdate(id,patch){
    await db.updateSocialCA(id,patch);
    setSocialCAs(prev=>prev.map(ca=>ca.id===id?{...ca,...patch}:ca));
  }
  async function handleEmailCAUpdate(id,patch){
    await db.updateSocialCA(id,patch);
    setEmailCAs(prev=>prev.map(ca=>ca.id===id?{...ca,...patch}:ca));
  }
  async function handleEmailCADelete(id){
    await db.deleteCA(id);
    setEmailCAs(prev=>prev.filter(ca=>ca.id!==id));
  }
  async function handleSocialCADelete(id){
    await db.deleteCA(id);
    setSocialCAs(prev=>prev.filter(ca=>ca.id!==id));
  }
  async function handleBulkApproveEmail(list){
    const pending=(list||emailCAs).filter(ca=>ca.status==='pending');
    if(!pending.length)return;
    if(!confirm(`Approve ${pending.length} pending email${pending.length>1?'s':''}? They will blast at their scheduled send times.`))return;
    const now2=new Date().toISOString();
    const ids=new Set(pending.map(ca=>ca.id));
    await Promise.all(pending.map(ca=>db.updateSocialCA(ca.id,{status:'approved',approved_at:now2})));
    setEmailCAs(prev=>prev.map(ca=>ids.has(ca.id)?{...ca,status:'approved',approved_at:now2}:ca));
  }
  async function handleBulkApproveSocial(){
    const pending=socialCAs.filter(ca=>ca.status==='pending');
    if(!pending.length)return;
    if(!confirm(`Approve all ${pending.length} pending social captions? They will go live on their scheduled Wednesdays.`))return;
    const now2=new Date().toISOString();
    await Promise.all(pending.map(ca=>db.updateSocialCA(ca.id,{status:'approved',approved_at:now2})));
    setSocialCAs(prev=>prev.map(ca=>ca.status==='pending'?{...ca,status:'approved',approved_at:now2}:ca));
  }

  async function handleAssetUpdate(asset){
    await db.updateAsset(asset);
    // Sync status to content_approvals for real_gains series
    if(['approved','rejected','revision_requested'].includes(asset.status)){
      await db.syncContentApproval(asset.id, asset.status);
    }
    setMediaAssets(prev=>prev.map(a=>a.id===asset.id?asset:a));
  }

  async function handleAssetArchive(asset){
    if(!confirm(`Archive "${asset.asset_name||'this asset'}" to the Client Repository and remove it from the active pool?\n\nA full snapshot (image URL, copy, publish date) will be saved permanently.`))return;
    try{
      const ca=await db.getLinkedCA(asset.id);
      await db.archiveAsset(asset,ca);
      await db.deleteAsset(asset.id);
      if(ca)await db.deleteCA(ca.id);
      setMediaAssets(prev=>prev.filter(a=>a.id!==asset.id));
      const arc=await db.getArchive();setArchive(arc);
    }catch(e){alert('Archive failed — check console for details.');}
  }

  async function handleAssetDelete(asset){
    if(!confirm(`Permanently delete this rejected asset?\n\n"${asset.asset_name||asset.id}"\n\nThis cannot be undone.`))return;
    const ca=await db.getLinkedCA(asset.id);
    await db.deleteAsset(asset.id);
    if(ca)await db.deleteCA(ca.id);
    setMediaAssets(prev=>prev.filter(a=>a.id!==asset.id));
  }

  async function handleArchivePurge(row){
    if(!confirm(`Permanently purge this archive record?\n\n"${row.title||row.campaign_id}"\n\nThe snapshot will be deleted. This cannot be undone.`))return;
    try{
      await fetch(`${SB_URL}/rest/v1/content_archive?id=eq.${row.id}`,{method:'DELETE',headers:SBH});
      setArchive(prev=>prev.filter(r=>r.id!==row.id));
    }catch(e){console.error(e);}
  }

  // Stats — combined across copy + media + social CAs for Content tab
  const copyCounts={all:copyItems.length};
  Object.keys(STATUS).forEach(s=>{copyCounts[s]=copyItems.filter(i=>i.status===s).length;});
  const mediaCounts={all:mediaAssets.length};
  Object.keys(STATUS).forEach(s=>{mediaCounts[s]=mediaAssets.filter(a=>a.status===s).length;});
  // Social CA status → STATUS key mapping
  const CA_TO_STATUS={pending:'pending_review',approved:'approved',skipped:'rejected',published:'published',revision_requested:'revision_requested'};
  const soCACounts={all:socialCAs.length,pending_review:0,approved:0,rejected:0,published:0,revision_requested:0,generating:0};
  socialCAs.forEach(ca=>{const k=CA_TO_STATUS[ca.status];if(k)soCACounts[k]=(soCACounts[k]||0)+1;});
  const emCACounts={all:emailCAs.length,pending_review:0,approved:0,rejected:0,published:0,revision_requested:0,generating:0};
  emailCAs.forEach(ca=>{const k=CA_TO_STATUS[ca.status];if(k)emCACounts[k]=(emCACounts[k]||0)+1;});
  // Combined counts for Content tab
  const contentCounts={all:copyItems.length+mediaAssets.length+socialCAs.length+emailCAs.length};
  Object.keys(STATUS).forEach(s=>{contentCounts[s]=(copyCounts[s]||0)+(mediaCounts[s]||0)+(soCACounts[s]||0)+(emCACounts[s]||0);});
  // Scheduled = approved content that has a scheduled_for (queued to go out) AND passes the integrity check
  contentCounts['scheduled']=[...socialCAs,...emailCAs].filter(c=>c.status==='approved'&&c.scheduled_for&&validateForFire(c).ok).length+mediaAssets.filter(a=>a.status==='approved'&&rgSchedule[a.id]&&rgSchedule[a.id].scheduled_for&&rgSchedule[a.id].fireValid).length;
  // Flagged Issue = approved but FAILS the integrity check — held out of Schedule until resolved (🛠 system self-heals · ⚠️ needs you)
  const flaggedList=[
    ...socialCAs.filter(c=>c.status==='approved'&&!validateForFire(c).ok).map(c=>({id:c.id,kind:'social',label:'📸 TDOW Social',title:c.subject||('Wk'+c.week_number),when:c.scheduled_for,v:validateForFire(c)})),
    ...emailCAs.filter(c=>c.status==='approved'&&!validateForFire(c).ok).map(c=>({id:c.id,kind:'email',label:'📧 Email',title:c.subject||('Wk'+c.week_number),when:c.scheduled_for,v:validateForFire(c)})),
    ...mediaAssets.filter(a=>a.status==='approved'&&rgSchedule[a.id]&&!rgSchedule[a.id].fireValid).map(a=>({id:a.id,kind:'real_gains',label:'🏓 Real Gains',title:a.asset_name||a.campaign_name||('Wk'+(rgSchedule[a.id]?.week_number||'')),when:rgSchedule[a.id]?.scheduled_for,v:{ok:false,hard:(rgSchedule[a.id]?.fireReasons||[]).map(r=>({reason:r,cls:/copy|caption|image|subject/i.test(r)?'human':'system'})),reasons:rgSchedule[a.id]?.fireReasons||[]}})),
  ];
  contentCounts['flagged']=flaggedList.length;

  // Campaign detector for media assets
  const assetCampaign=asset=>{
    if(rgSchedule[asset.id])return'real_gains';
    if(asset.channel==='email')return'email';
    return'social';
  };

  const filteredCopy=copyItems.filter(item=>{
    if(filterStatus!=='all'&&item.status!==filterStatus)return false;
    if(filterClient!=='all'&&item.clientId!==filterClient)return false;
    return true;
  });
  const filteredSocialCAs=socialCAs.filter(ca=>{
    if(filterCampaign!=='all'&&filterCampaign!=='social')return false;
    if(filterStatus==='flagged')return ca.status==='approved'&&!validateForFire(ca).ok;
    if(filterStatus!=='all'&&CA_TO_STATUS[ca.status]!==filterStatus)return false;
    return true;
  });
  const filteredEmailCAs=emailCAs.filter(ca=>{
    if(filterCampaign!=='all'&&filterCampaign!=='email')return false;
    if(filterStatus==='flagged')return ca.status==='approved'&&!validateForFire(ca).ok;
    if(filterStatus!=='all'&&CA_TO_STATUS[ca.status]!==filterStatus)return false;
    return true;
  });
  const filteredMedia=mediaAssets.filter(asset=>{
    if(filterStatus==='flagged'){ if(!(asset.status==='approved'&&rgSchedule[asset.id]&&!rgSchedule[asset.id].fireValid))return false; }
    else if(filterStatus!=='all'&&asset.status!==filterStatus)return false;
    if(filterClient!=='all'&&asset.client_id!==filterClient)return false;
    if(filterCampaign!=='all'&&assetCampaign(asset)!==filterCampaign)return false;
    return true;
  }).sort((a,b)=>{
    // Sort by week_number for Real Gains (most urgent first), then by created_at
    const wa=rgSchedule[a.id]?.week_number,wb=rgSchedule[b.id]?.week_number;
    if(wa&&wb)return wa-wb;
    if(wa)return -1;
    if(wb)return 1;
    return new Date(a.created_at)-new Date(b.created_at);
  });

  const counts=contentCounts;
  const statusTabs=[
    {k:'all',l:'All'},{k:'pending_review',l:'Pending'},{k:'revision_requested',l:'Revision Needed'},
    {k:'approved',l:'Approved'},{k:'flagged',l:'⚠️ Flagged Issue'},{k:'rejected',l:'Rejected'},{k:'scheduled',l:'Scheduled'},{k:'published',l:'Published'},
  ];

  const pendingContent=(contentCounts['pending_review']||0);
  const showFilters=activeTab==='content';
  const pendingArchiveCleanup=mediaAssets.filter(a=>a.status==='published'||a.status==='rejected').length;

  // ── Scheduled view: unified table of what's queued to go out (approved + scheduled_for), earliest → latest ──
  const fmtSched=d=>d?new Date(d).toLocaleString('en-MY',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Kuala_Lumpur'}):'—';
  const fmtDay=d=>d?new Date(d).toLocaleDateString('en-MY',{weekday:'short',timeZone:'Asia/Kuala_Lumpur'}):'';
  const scheduledRows=[
    ...socialCAs.filter(c=>c.status==='approved'&&c.scheduled_for&&validateForFire(c).ok).map(c=>({id:c.id,date:c.scheduled_for,ck:'social',campaign:'TDOW Social',title:c.subject||'Social post',platform:'📸 IG · 📘 FB',clientId:null})),
    ...emailCAs.filter(c=>c.status==='approved'&&c.scheduled_for&&validateForFire(c).ok).map(c=>({id:c.id,date:c.scheduled_for,ck:'email',campaign:c.full_content?.seriesName||(c.week_number?'TDOW Email':'Email'),title:c.subject||'Email',platform:'📧 Email',clientId:null})),
    ...mediaAssets.filter(a=>a.status==='approved'&&rgSchedule[a.id]&&rgSchedule[a.id].scheduled_for&&rgSchedule[a.id].fireValid).map(a=>({id:a.id,date:rgSchedule[a.id].scheduled_for,ck:'real_gains',campaign:'Real Gains',title:a.asset_name||a.campaign_name||'Real Gains post',platform:'📸 IG · 📘 FB',clientId:a.client_id})),
  ].filter(r=>(filterCampaign==='all'||r.ck===filterCampaign)&&(filterClient==='all'||!r.clientId||r.clientId===filterClient))
   .sort((a,b)=>new Date(a.date)-new Date(b.date));
  const scheduledTableHtml=html`<div>
    <div style=${{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
      <span style=${{color:'#4a86f5',fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:'1.5px'}}>📅 Scheduled — earliest to latest (${scheduledRows.length})</span>
      <div style=${{flex:1,height:'0.5px',background:'#17304e'}}></div>
    </div>
    ${scheduledRows.length===0?html`<div style=${{textAlign:'center',padding:'60px 20px',color:C.mt}}><div style=${{fontSize:28,marginBottom:10}}>📭</div><div style=${{fontSize:13}}>Nothing scheduled for the current filters.</div></div>`
    :html`<div style=${{background:C.s1,border:`0.5px solid ${C.bd}`,borderRadius:10,overflow:'hidden'}}>
      <div style=${{display:'grid',gridTemplateColumns:'160px 56px 120px 1fr 110px',padding:'9px 14px',borderBottom:`0.5px solid ${C.bd}`,fontSize:10,color:C.dm,textTransform:'uppercase',letterSpacing:'0.5px',fontWeight:700}}>
        <div>📅 Date (MYT)</div><div>Day</div><div>Campaign</div><div>Title</div><div>Platform</div>
      </div>
      ${scheduledRows.map((r,i)=>html`<div key=${r.id} style=${{display:'grid',gridTemplateColumns:'160px 56px 120px 1fr 110px',padding:'10px 14px',borderBottom:i<scheduledRows.length-1?`0.5px solid ${C.bd}55`:'none',fontSize:12,alignItems:'center',background:i%2?'rgba(14,24,48,0.3)':'transparent'}}>
        <div style=${{color:C.tx}}>${fmtSched(r.date)}</div>
        <div style=${{color:fmtDay(r.date)==='Tue'?'#4a86f5':fmtDay(r.date)==='Wed'?'#fb923c':fmtDay(r.date)==='Fri'?'#34d399':C.dm,fontWeight:600}}>${fmtDay(r.date)}</div>
        <div style=${{color:C.dm}}>${r.campaign}</div>
        <div style=${{color:C.tx,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',paddingRight:8}}>${r.title}</div>
        <div style=${{color:C.dm,fontSize:11}}>${r.platform}</div>
      </div>`)}
    </div>`}
  </div>`;

  return html`<div style=${{minHeight:'100vh',background:C.bg}}>

    <!-- Header -->
    <div style=${{background:C.s1,borderBottom:`0.5px solid ${C.bd}`,padding:'0 20px',position:'sticky',top:0,zIndex:100}}>
      <div style=${{maxWidth:1100,margin:'0 auto',display:'flex',justifyContent:'space-between',alignItems:'center',height:52}}>
        <div style=${{display:'flex',alignItems:'center',gap:10}}>
          <span style=${{fontSize:17,fontWeight:700,color:C.tx,letterSpacing:'-0.3px'}}>OmniraAI</span>
          <span style=${{color:C.bd}}>·</span>
          <span style=${{fontSize:13,color:C.dm}}>Content Approval</span>
        </div>
        <div style=${{display:'flex',alignItems:'center',gap:10}}>
          ${lastRefresh?html`<span style=${{fontSize:11,color:C.mt}}>Updated ${fmtdt(lastRefresh)}</span>`:''}
          <button onClick=${()=>loadData()} disabled=${loading} style=${{background:'transparent',border:`0.5px solid ${C.bd}`,borderRadius:6,color:C.dm,padding:'5px 13px',fontSize:12,cursor:'pointer',opacity:loading?0.5:1}}>
            ${loading?'…':'↻ Refresh'}
          </button>
        </div>
      </div>
    </div>

    <div style=${{maxWidth:1100,margin:'0 auto',padding:'20px'}}>

      <!-- Tab switcher -->
      <div style=${{display:'flex',gap:8,marginBottom:20,flexWrap:'wrap'}}>
        <button onClick=${()=>setActiveTab('content')} style=${{background:activeTab==='content'?C.pu:C.s1,color:activeTab==='content'?'#fff':C.dm,border:`0.5px solid ${activeTab==='content'?C.pu:C.bd}`,borderRadius:8,padding:'9px 22px',fontSize:14,fontWeight:600,cursor:'pointer',position:'relative'}}>
          📋 Content
          ${pendingContent>0?html`<span style=${{position:'absolute',top:-6,right:-6,background:C.wn,color:'#0a0a00',borderRadius:10,padding:'1px 6px',fontSize:10,fontWeight:700}}>${pendingContent}</span>`:''}
        </button>
        <button onClick=${()=>setActiveTab('schedule')} style=${{background:activeTab==='schedule'?C.tl:C.s1,color:activeTab==='schedule'?'#001a18':C.dm,border:`0.5px solid ${activeTab==='schedule'?C.tl:C.bd}`,borderRadius:8,padding:'9px 22px',fontSize:14,fontWeight:600,cursor:'pointer'}}>
          📅 Schedule
        </button>
        <button onClick=${()=>setActiveTab('deployments')} style=${{background:activeTab==='deployments'?'#6366f1':C.s1,color:activeTab==='deployments'?'#fff':C.dm,border:`0.5px solid ${activeTab==='deployments'?'#6366f1':C.bd}`,borderRadius:8,padding:'9px 22px',fontSize:14,fontWeight:600,cursor:'pointer'}}>
          🚀 Deployments
        </button>
        <button onClick=${()=>setActiveTab('archive')} style=${{background:activeTab==='archive'?'#2dd4bf':C.s1,color:activeTab==='archive'?'#001a18':C.dm,border:`0.5px solid ${activeTab==='archive'?'#2dd4bf':C.bd}`,borderRadius:8,padding:'9px 22px',fontSize:14,fontWeight:600,cursor:'pointer',position:'relative'}}>
          📦 Archive
          ${archive.length>0?html`<span style=${{position:'absolute',top:-6,right:-6,background:'#2dd4bf',color:'#001a18',borderRadius:10,padding:'1px 6px',fontSize:10,fontWeight:700}}>${archive.length}</span>`:''}
        </button>
      </div>

      <!-- Stats row (Content tab only) -->
      ${showFilters&&html`<div>
        <div style=${{display:'flex',gap:10,marginBottom:16,flexWrap:'wrap'}}>
          ${Object.entries(STATUS).map(([k,cfg])=>html`<div key=${k} style=${{background:C.s1,border:`0.5px solid ${counts[k]>0?cfg.c+'50':C.bd}`,borderRadius:8,padding:'10px 16px',textAlign:'center',minWidth:90,flex:1}}>
            <div style=${{fontSize:20,fontWeight:700,color:counts[k]>0?cfg.c:C.mt}}>${counts[k]||0}</div>
            <div style=${{fontSize:10,color:C.dm,textTransform:'uppercase',letterSpacing:'0.5px',marginTop:2,lineHeight:1.3}}>${cfg.l}</div>
          </div>`)}
        </div>

        <!-- Campaign filter chips — count respects current status filter so chips always match what you see -->
        <div style=${{display:'flex',gap:6,flexWrap:'wrap',marginBottom:10}}>
          ${[
            {k:'all',        l:'All Campaigns',   color:'#4a86f5'},
            {k:'real_gains', l:'🏓 Real Gains',    color:'#2dd4bf'},
            {k:'social',     l:'📸📘 TDOW Social', color:'#fb923c'},
            {k:'email',      l:'📧 Email (all series)', color:'#4a86f5'},
          ].map(({k,l,color})=>{
            // Count respects the current status filter so number always matches visible items
            const mediaBase=k==='all'?mediaAssets:mediaAssets.filter(a=>assetCampaign(a)===k);
            const mediaFiltered=filterStatus==='all'?mediaBase:mediaBase.filter(a=>a.status===filterStatus);
            // Add social CAs to 'all' and 'social' chip counts
            const caFiltered=(k==='all'||k==='social')
              ?(filterStatus==='all'?socialCAs:socialCAs.filter(ca=>CA_TO_STATUS[ca.status]===filterStatus))
              :[];
            const copyFiltered=(k==='all')
              ?(filterStatus==='all'?copyItems:copyItems.filter(i=>i.status===filterStatus))
              :[];
            const emCaFiltered=(k==='all'||k==='email')
              ?(filterStatus==='all'?emailCAs:emailCAs.filter(ca=>CA_TO_STATUS[ca.status]===filterStatus))
              :[];
            const cnt=mediaFiltered.length+caFiltered.length+copyFiltered.length+emCaFiltered.length;
            const active=filterCampaign===k;
            return html`<button key=${k} onClick=${()=>{setFilterCampaign(k);}} style=${{
              background:active?color+'22':'transparent',color:active?color:'#5a8ab0',
              border:`0.5px solid ${active?color+'55':'#17304e'}`,
              borderRadius:20,padding:'4px 13px',fontSize:12,fontWeight:active?700:400,cursor:'pointer'
            }}>${l} (${cnt})</button>`;
          })}
        </div>

        <!-- Status filter + client dropdown -->
        <div style=${{background:C.s1,border:`0.5px solid ${C.bd}`,borderRadius:10,padding:'12px 14px',marginBottom:16}}>
          <div style=${{display:'flex',gap:6,flexWrap:'wrap',marginBottom:8}}>
            ${statusTabs.map(({k,l})=>html`<button key=${k} onClick=${()=>setFilterStatus(k)}
              style=${{background:filterStatus===k?C.pu:C.s3,color:filterStatus===k?'#fff':C.dm,border:`0.5px solid ${filterStatus===k?C.pu:C.bd}`,borderRadius:6,padding:'5px 12px',fontSize:12,cursor:'pointer'}}>
              ${l} (${counts[k]||0})
            </button>`)}
          </div>
          <select value=${filterClient} onChange=${e=>setFilterClient(e.target.value)}
            style=${{background:C.s2,border:`0.5px solid ${C.bd}`,borderRadius:6,color:C.tx,padding:'6px 10px',fontSize:12,minWidth:180,outline:'none'}}>
            <option value="all">All Clients</option>
            ${clients.map(c=>html`<option key=${c.id} value=${c.id}>${c.basics?.brandName||c.basics?.clientName||c.id}</option>`)}
          </select>
        </div>
      </div>`}

      <!-- Content -->
      ${loading
        ?html`<${Spinner}/>`
        :activeTab==='archive'
          ?html`<${ArchiveTab} archive=${archive} onPurge=${handleArchivePurge} />`
          :activeTab==='deployments'
          ?html`<${DeploymentTab} deployments=${deployments} clients=${clients} />`
          :activeTab==='schedule'
          ?html`<${ScheduleTab} schedule=${schedule} clients=${clients} schedClientMap=${schedClientMap} />`
          :(activeTab==='content'&&filterStatus==='scheduled')
          ?scheduledTableHtml
          :/* activeTab === 'content' */
            html`<div>
              ${contentCounts['flagged']>0&&html`<div style=${{background:'rgba(248,113,113,0.08)',border:'0.5px solid rgba(248,113,113,0.4)',borderRadius:8,padding:'12px 16px',marginBottom:16,display:'flex',alignItems:'center',gap:12}}>
                <span style=${{fontSize:16}}>⚠️</span>
                <span style=${{color:'#fca5a5',fontSize:13,flex:1}}><b>${contentCounts['flagged']} approved item${contentCounts['flagged']!==1?'s':''} won't fire</b> — held OUT of Schedule until resolved. 🛠 system issues self-heal · ⚠️ others need you.</span>
                ${filterStatus!=='flagged'&&html`<button onClick=${()=>setFilterStatus('flagged')} style=${{background:'rgba(248,113,113,0.15)',color:'#fca5a5',border:'0.5px solid rgba(248,113,113,0.5)',borderRadius:6,padding:'5px 14px',fontSize:12,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap'}}>View Flagged Issues</button>`}
              </div>`}
              ${filterStatus==='flagged'&&flaggedList.length>0&&html`<div style=${{marginBottom:18}}>
                ${flaggedList.map(f=>html`<div key=${'fl'+f.id} style=${{background:C.s1,border:'0.5px solid rgba(248,113,113,0.3)',borderRadius:8,padding:'11px 14px',marginBottom:8}}>
                  <div style=${{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',marginBottom:6}}>
                    <span style=${{color:'#fca5a5',fontWeight:700,fontSize:12}}>${f.label}</span>
                    <span style=${{color:C.tx,fontSize:13,flex:1}}>${(f.title||'').slice(0,70)}</span>
                    <span style=${{color:C.mt,fontSize:11}}>${f.when?fmtDay(f.when):''}</span>
                  </div>
                  ${(f.v.hard||[]).map((h,hi)=>html`<div key=${hi} style=${{fontSize:11,color:h.cls==='system'?'#7dd3fc':'#fbbf24'}}>${h.cls==='system'?'🛠 auto-fixing (system): ':'⚠️ needs you: '}${h.reason}</div>`)}
                </div>`)}
                <div style=${{color:C.mt,fontSize:11,marginTop:6}}>Fix the ⚠️ items below (open the card to edit). Once resolved they move into Schedule automatically.</div>
              </div>`}
              ${pendingArchiveCleanup>0&&html`<div style=${{background:'rgba(45,212,191,0.07)',border:'0.5px solid rgba(45,212,191,0.25)',borderRadius:8,padding:'10px 16px',marginBottom:16,display:'flex',alignItems:'center',gap:12}}>
                <span style=${{fontSize:13}}>📦</span>
                <span style=${{color:'#5a8ab0',fontSize:12,flex:1}}>${pendingArchiveCleanup} asset${pendingArchiveCleanup!==1?'s':''} published or rejected — open them to archive or delete and free up space.</span>
                <button onClick=${()=>{setFilterStatus('published');}} style=${{background:'transparent',color:'#2dd4bf',border:'0.5px solid rgba(45,212,191,0.4)',borderRadius:6,padding:'4px 12px',fontSize:11,cursor:'pointer'}}>View Published</button>
              </div>`}
              ${filteredMedia.length===0&&filteredCopy.length===0&&filteredSocialCAs.length===0&&filteredEmailCAs.length===0&&html`<div style=${{textAlign:'center',padding:'80px 20px',color:C.mt}}>
                  <div style=${{fontSize:32,marginBottom:12}}>${mediaAssets.length===0&&copyItems.length===0&&socialCAs.length===0&&emailCAs.length===0?'📭':'🔍'}</div>
                  <div style=${{fontSize:14}}>${mediaAssets.length===0&&copyItems.length===0&&socialCAs.length===0&&emailCAs.length===0?'No content yet — run a campaign to generate assets':'No content matches current filters'}</div>
                </div>`}
              <!-- Media assets grid -->
              ${filteredMedia.length>0&&html`<div style=${{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(340px,1fr))',gap:16,marginBottom:24}}>
                ${filteredMedia.map(asset=>html`<${MediaAssetCard} key=${asset.id} asset=${asset} weekInfo=${rgSchedule[asset.id]||null} onUpdate=${handleAssetUpdate} onArchive=${handleAssetArchive} onDelete=${handleAssetDelete} />`)}
              </div>`}
              <!-- TDOW Social Captions section -->
              ${filteredSocialCAs.length>0&&html`<div style=${{marginBottom:24}}>
                <div style=${{marginBottom:12,display:'flex',alignItems:'center',gap:8}}>
                  <span style=${{color:'#fb923c',fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:'1.5px',whiteSpace:'nowrap'}}>📸 TDOW Social Captions (${filteredSocialCAs.length})</span>
                  <div style=${{flex:1,height:'0.5px',background:'#17304e'}}></div>
                  ${filteredSocialCAs.filter(ca=>ca.status==='pending').length>0&&html`<button onClick=${handleBulkApproveSocial}
                    style=${{background:'rgba(52,211,153,0.1)',color:C.ok,border:`0.5px solid ${C.ok}55`,borderRadius:6,padding:'4px 14px',fontSize:11,fontWeight:600,cursor:'pointer',whiteSpace:'nowrap'}}>
                    ✓ Approve All (${filteredSocialCAs.filter(ca=>ca.status==='pending').length})
                  </button>`}
                </div>
                ${filteredSocialCAs.map(ca=>html`<${SocialCaptionCard} key=${ca.id} ca=${ca} onUpdate=${handleSocialCAUpdate} onDelete=${handleSocialCADelete} />`)}
              </div>`}
              <!-- Email sections — one per series (seriesName, TDOW by week_number, else subject) -->
              ${filteredEmailCAs.length>0&&(()=>{
                const groups={};
                filteredEmailCAs.forEach(ca=>{
                  const k=ca.full_content?.seriesName||(ca.week_number?'Drill of the Week':(ca.subject||'Untitled Email'));
                  (groups[k]=groups[k]||[]).push(ca);
                });
                return Object.entries(groups).map(([series,cas])=>html`<div key=${series} style=${{marginBottom:24}}>
                  <div style=${{marginBottom:12,display:'flex',alignItems:'center',gap:8}}>
                    <span style=${{color:'#4a86f5',fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:'1.5px',whiteSpace:'nowrap'}}>📧 ${series} — Email (${cas.length})</span>
                    <div style=${{flex:1,height:'0.5px',background:'#17304e'}}></div>
                    ${cas.filter(ca=>ca.status==='pending').length>0&&html`<button onClick=${()=>handleBulkApproveEmail(cas)}
                      style=${{background:'rgba(52,211,153,0.1)',color:C.ok,border:`0.5px solid ${C.ok}55`,borderRadius:6,padding:'4px 14px',fontSize:11,fontWeight:600,cursor:'pointer',whiteSpace:'nowrap'}}>
                      ✓ Approve All (${cas.filter(ca=>ca.status==='pending').length})
                    </button>`}
                  </div>
                  ${cas.map(ca=>html`<${EmailCard} key=${ca.id} ca=${ca} onUpdate=${handleEmailCAUpdate} onDelete=${handleEmailCADelete} />`)}
                </div>`);
              })()}
              <!-- Copy queue section (only shown if items exist) -->
              ${filteredCopy.length>0&&html`<div>
                <div style=${{marginBottom:10,color:'#5a8ab0',fontWeight:700,fontSize:10,textTransform:'uppercase',letterSpacing:'1.5px',display:'flex',alignItems:'center',gap:8}}>
                  <span>📝 Email Copy Queue (${filteredCopy.length})</span>
                  <div style=${{flex:1,height:'0.5px',background:'#17304e'}}></div>
                </div>
                ${filteredCopy.map(item=>html`<${CopyContentCard} key=${item.id} item=${item} onUpdate=${handleCopyUpdate} onDelete=${handleCopyDelete} busy=${!!busy[item.id]} />`)}
              </div>`}
            </div>`
      }
    </div>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
