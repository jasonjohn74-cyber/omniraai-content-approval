// ── INTEGRITY GATE: will this item actually fire as scheduled? ────────────────
// Single source of truth — mirrors the live publisher read-fields (real_gains→post_caption||copy_body+image_url,
// email→drillDescription||emailBody+subject, social→full_content.caption(+media)). Each blocker is tagged
// 'system' (auto-fixable by the backend Integrity Doctor) or 'human' (only Jason can resolve). An item may ONLY
// enter the Scheduled folder / be allowed to fire when validateForFire(ca).ok === true.
const _AIMETA=/^(i\s|i'm|i’m|sure[,!]|here'?s|here’s|could you|to clarify|i appreciate|i notice|i'd be happy|i’d be happy|i can help|let me know|i understand|i cannot|i can't|i'm unable|i’m unable|thanks for|thank you for)/i;
const _vtxt=s=>(s==null?'':String(s)).trim();
function validateForFire(ca){
  const fc=(ca&&ca.full_content)||{}, t=ca&&ca.content_type, hard=[], warn=[];
  const add=(reason,cls)=>hard.push({reason,cls});
  // schedule must exist + parse
  const sf=ca&&ca.scheduled_for, sd=sf?new Date(sf):null;
  if(!sf||!sd||isNaN(sd.getTime())) add('no valid schedule date/time set','human');
  else if(sd.getTime()<Date.now()-30*60000 && ca.status!=='published') warn.push('scheduled time is in the past');
  // resolve copy + media exactly as the publisher does
  let copy='', media='', mediaReq=false;
  if(t==='real_gains'){ copy=_vtxt(fc.post_caption||fc.copy_body); media=_vtxt(fc.image_url); mediaReq=true; }
  else if(t==='email'){ copy=_vtxt(fc.drillDescription||fc.emailBody); if(!_vtxt(fc.emailSubject||(ca&&ca.subject))) add('email subject missing','human'); if(!_vtxt(fc.imageUrl)) warn.push('email image missing'); }
  else if(t==='social'){ copy=_vtxt(fc.caption||(ca&&ca.preview_text)); media=_vtxt(fc.igVideoUrl||fc.youtubeUrl||fc.youtube_url); mediaReq=true;
    if(!_vtxt(fc.caption)&&_vtxt(ca&&ca.preview_text)) add('caption not saved to full_content (publisher would fall back to Google Sheets)','system'); }
  else add('unknown content type','human');
  if(copy.length<25) add('copy is empty or too short','human');
  else if(_AIMETA.test(copy)) add('copy looks like an AI reply, not final content','human');
  if(mediaReq && !/^https?:\/\//.test(media)) add(t==='social'?'no IG/FB media set':'image missing','human');
  return {ok:hard.length===0, hard, warn,
    needsHuman:hard.some(h=>h.cls==='human'), needsSystem:hard.some(h=>h.cls==='system'),
    reasons:hard.map(h=>h.reason)};
}

  useEffect(()=>{setCaptionText(weekInfo?.post_caption||asset.data?.copy_body||'');setCaptionKey(k=>k+1);},[weekInfo?.post_caption,asset.data?.copy_body]);

  const ch=CHANNEL_META[asset.channel]||{icon:'🖼',label:asset.channel,dims:'',type:'image'};
  const isVideo=asset.asset_type==='video'||asset.asset_url?.match(/\.(mp4|mov|webm)/i);
  const isActionable=['pending_review','revision_requested'].includes(asset.status);
  const isApproved=asset.status==='approved';
  const borderColor=asset.status==='pending_review'?C.bdB:asset.status==='approved'?C.ok+'50':asset.status==='revision_requested'?C.pu+'50':C.bd;

  async function loadHistory(){
    const r=await db.getAssetRevisions(asset.id);

  async function toggleHistory(){
    const next=!showHistory;setShowHistory(next);

  async function doApprove(){

  }
  async function doReject(){
    await onUpdate({...asset,status:'rejected',feedback:feedback||null});
  }
  function handleRefFiles(files){
    const file=[...files].find(f=>f.type.startsWith('image/'));
    if(!file)return;
    // Resize large images to max 1024px before encoding (keeps payload small)
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=1024;
        let{width:w,height:h}=img;
        if(w>MAX||h>MAX){const s=Math.min(MAX/w,MAX/h);w=Math.round(w*s);h=Math.round(h*s);}
        const canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        setReferenceImage(canvas.toDataURL('image/jpeg',0.85));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  }
  function handleRefDrop(e){
    e.preventDefault();setRefDragging(false);
    handleRefFiles(e.dataTransfer.files);
  }
  function handleRefPaste(e){
    const items=e.clipboardData?.items;
    if(!items)return;
    const imgItem=[...items].find(i=>i.type.startsWith('image/'));
    if(imgItem){e.preventDefault();handleRefFiles([imgItem.getAsFile()]);}
  }

  async function doRequestRevision(){
    if(!feedback.trim()){alert('Add feedback so AI knows what to change.');return;}
    setRegenerating(true);
    const updated={...asset,status:'revision_requested',feedback,revision_round:(asset.revision_round||1)+1};

    // Trigger n8n to regenerate — include reference image if provided
    try{

        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({

        })

  async function doRegenerateWithPrompt(){

    setRegenerating(true);
    const updated={...asset,status:'revision_requested',revision_round:(asset.revision_round||1)+1};
    await onUpdate(updated);
    try{
      await fetch(`${N8N}/webhook/regenerate-asset`,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          asset_id:asset.id,prompt:editedPrompt,use_prompt_as_is:true,

    setRegenerating(false);
  }
  async function doRestoreVersion(rev){
    if(!rev.asset_url)return;
    if(!confirm(`Restore v${rev.revision_number}? Current image will be replaced.`))return;
    setRestoring(true);
    await onUpdate({...asset,asset_url:rev.asset_url,prompt:rev.prompt||asset.prompt,status:'pending_review'});
    setImgError(false);
    setRestoring(false);
  }
  async function doPublish(){
    await onUpdate({...asset,status:'published',published_at:now()});
  }
  async function doPostNow(){
    if(!weekInfo?.week_number||!weekInfo?.ca_id)return;
    if(weekInfo.fireValid===false){alert("⚠️ This post has an issue and can't be blasted — resolve it in the Flagged Issue folder first.");return;}
    if(!confirm(`Post Real Gains Wk${weekInfo.week_number} "${asset.asset_name||'this post'}" to IG + FB right now?`))return;
    setPosting(true);setPostResult(null);
    fetch(`${N8N}/webhook/real-gains-run`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ca_id:weekInfo.ca_id,source:'app4_media_card'})}).catch(()=>{});
    setPostResult({ok:true,msg:'Triggered — Telegram will confirm once posted (allow ~3 min for IG processing)'});
    setPosting(false);
  }

  function flashCopyMsg(msg){setCopySaveMsg(msg);setTimeout(()=>setCopySaveMsg(''),3000);}
  // SINGLE SOURCE OF TRUTH: persist caption to BOTH content_approvals.post_caption
  // (n8n publisher reads this) AND campaign_assets.data.copy_body (display + deployments
  // read this) so the displayed copy and the editor never diverge. Also refreshes local
  // React state via onUpdate so the UI reflects the saved copy immediately.
  async function persistCaption(text,extra={}){
    // 1) content_approvals.full_content.post_caption — what the publisher sends to IG/FB
    if(weekInfo?.ca_id){
      const r=await fetch(`${SB_URL}/rest/v1/content_approvals?id=eq.${weekInfo.ca_id}&select=full_content`,{headers:SBH});
      const recs=await r.json();
      const fc={...(recs?.[0]?.full_content||{}),post_caption:text,...(extra.caFields||{})};
      await fetch(`${SB_URL}/rest/v1/content_approvals?id=eq.${weekInfo.ca_id}`,{
        method:'PATCH',headers:{...SBH,'Prefer':'return=minimal'},
        body:JSON.stringify({full_content:fc,updated_at:new Date().toISOString()})
      });
    }
    // 2) campaign_assets.data.copy_body — the copy shown on the card + Deployments tab
    const newData={...(asset.data||{}),copy_body:text,...(extra.assetData||{})};
    await onUpdate({...asset,data:newData,...(extra.assetFields||{})});
  }
  async function saveCaptionEdit(){
    setCaptionBusy(true);
    try{
      await persistCaption(captionText);
      flashCopyMsg('✓ Copy saved — it now matches the preview above');
    }catch(e){alert('Save failed: '+e.message);}
    setCaptionBusy(false);
  }
  async function doRewriteCaption(){
    if(!captionNote.trim()){alert('Add notes so AI knows how to rewrite the caption.');return;}
    setCaptionBusy(true);
    const topic=asset.data?.topic||asset.asset_name||'pickleball drill';
    const sys='You are an expert social media copywriter for Titan Ball Machines MY, a pickleball equipment brand in Malaysia. Write engaging, energetic captions for Instagram and Facebook.';
    const usr=`Rewrite the following Instagram/Facebook caption for a "Real Gains with Titan" post based on the reviewer feedback.\n\nTopic: ${topic}\nWeek: ${weekInfo?.week_number||''}\n\nCurrent caption:\n${captionText||'(not set — auto-generated from topic)'}\n\nRevision notes: ${captionNote}\n\nWrite ONLY the revised caption. Preserve hashtags and partner venue handles if present. No preamble or labels.`;
    try{
      const res=await fetch(`${N8N}/webhook/claude-proxy`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system:sys,prompt:usr})});
      const raw=await res.text();
      let data;try{data=JSON.parse(raw);}catch{throw new Error('Bad response: '+raw.slice(0,100));}
      const newText=(data?.content?.[0]?.text||data?.[0]?.content?.[0]?.text||data?.body?.content?.[0]?.text||'').trim();
      if(newText){
        setCaptionText(newText);
        setCaptionKey(k=>k+1);
        setCopyEditMode('manual');
        await persistCaption(newText);
        setCaptionNote('');
        flashCopyMsg('✓ AI rewrite saved — now showing in Edit Directly');
      }else{alert('Claude returned empty response.');}
    }catch(e){alert('Caption rewrite failed: '+e.message);}
    setCaptionBusy(false);
  }
  async function doRequestCopyRevision(){
    if(copyEditMode==='manual'){await saveCaptionEdit();}
    else{await doRewriteCaption();}
  }
  async function doSaveAsDraft(){
    setCaptionBusy(true);
    try{
      await persistCaption(captionText,{caFields:{draft_saved:true},assetData:{draft_saved:true}});
      setDraftSaved(true);
      flashCopyMsg('✓ Draft saved');

  async function doSaveAndApprove(){

    if(url){

      await onUpdate(updated);
      setImgError(false);

  return html`<div style=${{background:C.s1,border:`0.5px solid ${borderColor}`,borderRadius:10,marginBottom:12,overflow:'hidden',animation:'fadeIn 0.2s ease'}}>

        ${weekInfo&&html`<div style=${{marginBottom:10}}>
          <button onClick=${doPostNow} disabled=${posting}

            ${posting?'⏳ Firing…':'🚀 Post Now to IG + FB'}

          ${postResult&&html`<div style=${{marginTop:6,fontSize:11,color:postResult.ok?C.ok:'#f87171'}}>${postResult.msg}</div>`}
        </div>`}
        <div style=${{display:'flex',gap:8,flexWrap:'wrap'}}>
          ${weekInfo
            ?html`<button onClick=${doPublish}
                style=${{background:'transparent',color:'#5a8ab0',border:`0.5px solid #17304e`,borderRadius:6,padding:'7px 14px',fontSize:12,cursor:'pointer'}}
                title="Mark as published without posting — use if you posted manually outside the system">
                ✓ Mark Published Manually
              </button>`
            :html`<button onClick=${doPublish}
                style=${{background:C.tl,color:'#001a18',border:'none',borderRadius:6,padding:'8px 18px',fontSize:13,fontWeight:700,cursor:'pointer'}}>
                🚀 Mark as Published
              </button>`
          }
          <button onClick=${async()=>{await onUpdate({...asset,status:'pending_review',approved_at:null});}}
            style=${{background:'transparent',color:'#fbbf24',border:'0.5px solid rgba(251,191,36,0.5)',borderRadius:6,padding:'7px 14px',fontSize:13,cursor:'pointer'}}
            title="Re-open this asset so you can revise copy or regenerate the image before publishing">
            ✏️ Re-open for Revision
          </button>
        </div>
        <div style=${{color:'#5a8ab0',fontSize:10,marginTop:6}}>
          ${weekInfo?'"Post Now" fires the Real Gains publisher to IG + FB. "Mark Manually" is for posts done outside the system.':'Re-open returns this to Pending so you can revise or regenerate before publishing.'}
        </div>
      </div>`}

      ${asset.status==='published'&&html`<div style=${{borderTop:`0.5px solid ${C.bd}`,paddingTop:10}}>
        <div style=${{color:C.tl,fontSize:11,marginBottom:10}}>🚀 Published ${fmtdt(asset.published_at)}</div>
        ${onArchive&&html`<div style=${{display:'flex',gap:8,alignItems:'center'}}>
          <button onClick=${()=>onArchive(asset)} style=${{background:'rgba(45,212,191,0.12)',color:C.tl,border:`0.5px solid ${C.tl}55`,borderRadius:6,padding:'7px 14px',fontSize:12,fontWeight:600,cursor:'pointer'}}>
            📦 Archive & Remove
          </button>
          <span style=${{color:'#274466',fontSize:10}}>Saves a permanent record then removes from active pool.</span>
        </div>`}
      </div>`}

      ${asset.status==='rejected'&&html`<div style=${{borderTop:`0.5px solid ${C.bd}`,paddingTop:12}}>
        ${asset.feedback&&html`<div style=${{background:`${C.er}08`,border:`0.5px solid ${C.er}25`,borderRadius:6,padding:'8px 12px',marginBottom:10,fontSize:11,color:'#f87171',lineHeight:1.5}}>
          <span style=${{fontWeight:700}}>Rejection feedback: </span>${asset.feedback}
        </div>`}
        <div style=${{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
          <button onClick=${async()=>{
            await onUpdate({...asset,status:'revision_requested',approved_at:null});
            await db.syncContentApproval(asset.id,'revision_requested');
          }} style=${{background:`${C.pu}15`,color:C.pu,border:`0.5px solid ${C.pu}55`,borderRadius:6,padding:'7px 14px',fontSize:12,fontWeight:600,cursor:'pointer'}} title="Returns to revision queue with feedback intact — ready for AI regen">
            ↩ Restore for Revision
          </button>
          <button onClick=${async()=>{
            await onUpdate({...asset,status:'pending_review',feedback:null,approved_at:null});
            await db.syncContentApproval(asset.id,'pending_review');
          }} style=${{background:'rgba(74,134,245,0.1)',color:C.ac,border:`0.5px solid rgba(74,134,245,0.4)`,borderRadius:6,padding:'7px 14px',fontSize:12,cursor:'pointer'}} title="Clears feedback and returns to pending review">
            ↺ Back to Pending
          </button>
          ${onDelete&&html`<button onClick=${()=>onDelete(asset)} style=${{background:'rgba(248,113,113,0.08)',color:C.er,border:`0.5px solid ${C.er}40`,borderRadius:6,padding:'7px 10px',fontSize:12,cursor:'pointer'}} title="Permanently delete this asset">
            🗑️ Delete
          </button>`}
        </div>
        <div style=${{color:'#274466',fontSize:10,marginTop:6}}>"Restore for Revision" keeps feedback for AI regen. "Back to Pending" clears it and resets to fresh review.</div>
      </div>`}

    </div>
  </div>`;
}

// ── COPY CONTENT CARD (existing, unchanged logic) ────────────
function CopyContentCard({item,onUpdate,onDelete,busy}){
  const[note,setNote]=useState(item.reviewerNotes||'');
  const[selVar,setSelVar]=useState(item.selectedVariation||0);
  const[copied,setCopied]=useState(false);
  const[editing,setEditing]=useState(false);
  const[editText,setEditText]=useState('');
  const[saving,setSaving]=useState(false);
  const[revisions,setRevisions]=useState([]);
  const[revisionsLoaded,setRevisionsLoaded]=useState(false);
  const[showHistory,setShowHistory]=useState(false);
  const[regenerating,setRegenerating]=useState(false);

  const fmt=FORMATS[item.formatId]||{icon:'📄',label:item.formatId||'Content'};
  const vars=item.copyVariations||[item.copyText||''];
  const isActionable=['pending_review','revision_requested'].includes(item.status);
  const isApproved=item.status==='approved';
  const SOURCE_STYLE={human_edit:{c:C.ac,l:'Human Edit'},claude_regeneration:{c:C.pu,l:'AI Regen'},original:{c:C.dm,l:'Original'},restored:{c:C.tl,l:'Restored'}};
  const borderColor=item.status==='pending_review'?C.bdB:item.status==='approved'?C.ok+'50':item.status==='revision_requested'?C.pu+'50':C.bd;

  async function loadRevisions(){const r=await db.getRevisions(item.id);setRevisions(r);setRevisionsLoaded(true);}
  async function toggleHistory(){const next=!showHistory;setShowHistory(next);if(next&&!revisionsLoaded)await loadRevisions();}
  async function selectVar(i){setSelVar(i);await onUpdate({...item,selectedVariation:i,updatedAt:now()});}
  function startEdit(){setEditText(vars[selVar]||'');setEditing(true);}
  function cancelEdit(){setEditing(false);}

  async function saveEdit(){
    const trimmed=editText.trim();
    if(!trimmed||trimmed===vars[selVar]){setEditing(false);return;}
    setSaving(true);
    const newVars=[...vars];newVars[selVar]=trimmed;
    const updated={...item,copyVariations:newVars,updatedAt:now()};
    const vNum=revisionsLoaded?revisions.length+1:1;
    await db.logRevision({id:uid(),queue_item_id:item.id,client_id:item.clientId||null,campaign_id:item.campaignId||null,asset_type:'copy',format_id:item.formatId,variant_label:varLabel(selVar),version_number:vNum,content:trimmed,source:'human_edit',revision_notes:note||null,status:'active',created_by:'Jason',data:updated});
    await onUpdate(updated);
    const r=await db.getRevisions(item.id);setRevisions(r);setRevisionsLoaded(true);
    setSaving(false);setEditing(false);
  }

  async function restoreRevision(rev){
    const idx=Math.max(0,'ABCDEFGHIJ'.indexOf(rev.variant_label||'A'));
    const newVars=[...vars];newVars[idx]=rev.content;
    const updated={...item,copyVariations:newVars,updatedAt:now()};
    await db.logRevision({id:uid(),queue_item_id:item.id,client_id:item.clientId||null,campaign_id:item.campaignId||null,asset_type:'copy',format_id:item.formatId,variant_label:rev.variant_label||varLabel(idx),version_number:revisions.length+1,content:rev.content,source:'human_edit',revision_notes:`Restored from v${rev.version_number}`,status:'restored',created_by:'Jason',data:updated});
    await onUpdate(updated);
    const r=await db.getRevisions(item.id);setRevisions(r);
  }

  async function doApprove(){await onUpdate({...item,status:'approved',selectedVariation:selVar,approvedAt:now(),updatedAt:now(),reviewerNotes:note||null});}
  async function doRevision(){
    if(!note.trim()){alert('Add revision notes — Claude will use these to regenerate the copy.');return;}
    setRegenerating(true);
    await onUpdate({...item,status:'revision_requested',reviewerNotes:note,updatedAt:now()});
    const sys=`You are an expert marketing copywriter for ${item.clientName||'the brand'}. You are revising existing marketing copy based on reviewer feedback.`;
    const usr=`Revise the following ${item.formatLabel||item.formatId} copy based on the revision notes below.\n\nOriginal brief: ${item.brief||'Not specified'}\nLanguage: ${item.language||'English'}\nTone: ${item.tone||'Use brand voice'}\n\nCurrent copy:\n${vars[selVar]||''}\n\nRevision notes from reviewer: ${note}\n\nWrite ONLY the revised copy. No preamble, no explanation, no labels. Output the copy directly.`;
    try{
      const res=await fetch(`${N8N}/webhook/claude-proxy`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system:sys,prompt:usr})});
      const rawText=await res.text();
      if(!rawText||rawText.trim()===''){throw new Error('n8n returned empty response');}
      let data;try{data=JSON.parse(rawText);}catch{throw new Error('Invalid response: '+rawText.slice(0,120));}
      const newText=(data?.content?.[0]?.text||data?.[0]?.content?.[0]?.text||data?.body?.content?.[0]?.text||'').trim();
      if(newText){
        const newVars=[...vars];newVars[selVar]=newText;
        const vNum=revisionsLoaded?revisions.length+1:1;
        await db.logRevision({id:uid(),queue_item_id:item.id,client_id:item.clientId||null,campaign_id:item.campaignId||null,asset_type:'copy',format_id:item.formatId,variant_label:varLabel(selVar),version_number:vNum,content:newText,source:'claude_regeneration',revision_notes:note,status:'active',created_by:'Claude',data:{...item,copyVariations:newVars}});
        const updated={...item,copyVariations:newVars,status:'pending_review',reviewerNotes:note,updatedAt:now()};
        await onUpdate(updated);
        const r=await db.getRevisions(item.id);setRevisions(r);setRevisionsLoaded(true);
        setNote('');
      }else{alert('Claude returned empty response. Notes saved — try again.');}
    }catch(e){alert('Regeneration failed: '+e.message);}
    setRegenerating(false);
  }
  async function doReject(){await onUpdate({...item,status:'rejected',reviewerNotes:note||null,updatedAt:now()});}
  async function doPublish(){await onUpdate({...item,status:'published',publishedAt:now(),updatedAt:now()});}
  async function copyText(){try{await navigator.clipboard.writeText(vars[selVar]||'');setCopied(true);setTimeout(()=>setCopied(false),2000);}catch{window.prompt('Copy this text:',vars[selVar]||'');}}

  return html`<div style=${{background:C.s1,border:`0.5px solid ${borderColor}`,borderRadius:10,marginBottom:12,overflow:'hidden',animation:'fadeIn 0.2s ease'}}>
    <div style=${{padding:'13px 16px',display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:12,borderBottom:`0.5px solid ${C.bd}`}}>
      <div style=${{flex:1,minWidth:0}}>
        <div style=${{display:'flex',alignItems:'center',gap:7,flexWrap:'wrap',marginBottom:4}}>
          <span style=${{fontSize:15}}>${fmt.icon}</span>
          <span style=${{fontWeight:600,fontSize:14,color:C.tx}}>${item.clientName||'Unknown Client'}</span>
          <span style=${{color:C.dm,fontSize:12}}>${fmt.label}</span>
          ${item.campaignName?html`<span style=${{color:C.ac,fontSize:11}}>📋 ${item.campaignName}</span>`:''}
        </div>
        <div style=${{color:C.mt,fontSize:11}}>Submitted ${fmtdt(item.createdAt)} · ${vars.length} variation${vars.length!==1?'s':''}</div>
      </div>
      <div style=${{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:6,flexShrink:0}}>
        <${Badge} status=${item.status} />
        <button onClick=${()=>onDelete(item.id)} style=${{background:'transparent',border:'none',color:C.mt,cursor:'pointer',fontSize:12,padding:'1px 4px'}} title="Delete">✕</button>
      </div>
    </div>

    ${item.brief?html`<div style=${{padding:'8px 16px',background:C.s2+'60',borderBottom:`0.5px solid ${C.bd}`,fontSize:12,color:C.dm,lineHeight:1.5}}>
      <span style=${{color:C.mt,fontSize:10,textTransform:'uppercase',letterSpacing:'0.5px',marginRight:6}}>Brief</span>${item.brief}
    </div>`:''}

    <div style=${{padding:'14px 16px'}}>
      ${vars.length>1?html`<div style=${{display:'flex',gap:6,flexWrap:'wrap',marginBottom:10}}>
        ${vars.map((v,i)=>html`<button key=${i} onClick=${()=>selectVar(i)} style=${{background:selVar===i?C.ac:C.s3,color:selVar===i?'#fff':C.dm,border:`0.5px solid ${selVar===i?C.ac:C.bd}`,borderRadius:5,padding:'4px 11px',fontSize:11,cursor:'pointer'}}>
          Var ${varLabel(i)}${selVar===i?' ✓':''}
        </button>`)}
      </div>`:''}

      ${editing
        ?html`<div>
          <textarea value=${editText} onInput=${e=>setEditText(e.target.value)} autoFocus
            style=${{background:C.s2,border:`1px solid ${C.ac}`,borderRadius:8,padding:'12px 14px',fontSize:13,lineHeight:1.75,color:C.tx,width:'100%',resize:'vertical',minHeight:160,outline:'none'}}/>
          <div style=${{display:'flex',gap:7,marginTop:7,justifyContent:'flex-end'}}>
            <button onClick=${cancelEdit} style=${{background:'transparent',border:`0.5px solid ${C.bd}`,borderRadius:5,color:C.dm,padding:'5px 13px',fontSize:12,cursor:'pointer'}}>Cancel</button>
            <button onClick=${saveEdit} disabled=${saving} style=${{background:C.ac,border:'none',borderRadius:5,color:'#fff',padding:'5px 16px',fontSize:12,fontWeight:600,cursor:saving?'default':'pointer',opacity:saving?0.6:1}}>${saving?'Saving…':'Save Edit'}</button>
          </div>
        </div>`
        :html`<div>
          <div style=${{background:C.s2,border:`0.5px solid ${isApproved?C.ok+'50':C.bd}`,borderRadius:8,padding:'12px 14px',fontSize:13,lineHeight:1.75,color:C.tx,whiteSpace:'pre-wrap',maxHeight:220,overflowY:'auto'}}>
            ${vars[selVar]||'No copy generated'}
          </div>
          <div style=${{display:'flex',justifyContent:'flex-end',gap:7,marginTop:6}}>
            <button onClick=${copyText} style=${{background:'transparent',border:`0.5px solid ${C.bd}`,borderRadius:5,color:copied?C.ok:C.dm,padding:'4px 10px',fontSize:11,cursor:'pointer'}}>${copied?'✓ Copied':'Copy text'}</button>
            <button onClick=${startEdit} style=${{background:'transparent',border:`0.5px solid ${C.bdB}`,borderRadius:5,color:C.dm,padding:'4px 10px',fontSize:11,cursor:'pointer'}}>✏ Edit copy</button>
          </div>
        </div>`
      }

      <div style=${{marginTop:8}}>
        <button onClick=${toggleHistory} style=${{background:'transparent',border:`0.5px solid ${C.bd}`,borderRadius:6,color:C.dm,padding:'5px 11px',fontSize:11,cursor:'pointer',width:'100%',textAlign:'left',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <span style=${{color:C.or}}>🕑 Revision History${revisionsLoaded?' ('+revisions.length+')':''}</span>
          <span style=${{color:C.mt,fontSize:10}}>${showHistory?'▲ hide':'▼ show'}</span>
        </button>
        ${showHistory&&html`<div style=${{background:C.s1,border:`0.5px solid ${C.bd}`,borderTop:'none',borderRadius:'0 0 6px 6px',padding:'10px 12px',animation:'fadeIn 0.15s ease'}}>
          ${!revisionsLoaded
            ?html`<div style=${{color:C.dm,fontSize:12,padding:'8px 0'}}>Loading…</div>`
            :revisions.length===0
              ?html`<div style=${{color:C.mt,fontSize:12,padding:'8px 0'}}>No edits logged yet.</div>`
              :revisions.map((rev,i)=>{
                  const src=SOURCE_STYLE[rev.source]||{c:C.dm,l:rev.source||'Edit'};
                  return html`<div key=${i} style=${{borderBottom:i<revisions.length-1?`0.5px solid ${C.bd}`:'none',paddingBottom:10,marginBottom:10}}>
                    <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4,flexWrap:'wrap',gap:4}}>
                      <div style=${{display:'flex',gap:6,alignItems:'center'}}>
                        <span style=${{background:`${src.c}20`,color:src.c,border:`0.5px solid ${src.c}40`,borderRadius:10,padding:'1px 7px',fontSize:10,fontWeight:600}}>${src.l}</span>
                        <span style=${{color:C.mt,fontSize:10}}>Var ${rev.variant_label||'A'} · v${rev.version_number}</span>
                      </div>
                      <span style=${{color:C.mt,fontSize:10}}>${fmtdt(rev.created_at)}</span>
                    </div>
                    ${rev.revision_notes?html`<div style=${{color:C.dm,fontSize:11,marginBottom:5,fontStyle:'italic'}}>"${rev.revision_notes}"</div>`:''}
                    <div style=${{color:C.tx,fontSize:12,lineHeight:1.6,background:C.s2,borderRadius:6,padding:'6px 9px',whiteSpace:'pre-wrap',maxHeight:80,overflowY:'auto',marginBottom:5}}>
                      ${(rev.content||'').slice(0,300)}${(rev.content||'').length>300?'…':''}
                    </div>
                    <button onClick=${()=>restoreRevision(rev)} style=${{background:'transparent',border:`0.5px solid ${C.bd}`,borderRadius:4,color:C.dm,padding:'3px 9px',fontSize:10,cursor:'pointer'}}>↩ Restore this version</button>
                  </div>`;
                })
          }
        </div>`}
      </div>

      ${isActionable?html`<div style=${{marginTop:14,paddingTop:14,borderTop:`0.5px solid ${C.bd}`}}>
        <textarea placeholder="Revision notes (required for revision requests)…" value=${note} onInput=${e=>setNote(e.target.value)}
          style=${{background:C.s2,border:`0.5px solid ${C.bd}`,borderRadius:6,color:C.tx,padding:'8px 11px',fontSize:12,width:'100%',resize:'vertical',minHeight:64,outline:'none',marginBottom:10,lineHeight:1.5}}/>
        <div style=${{display:'flex',gap:8,flexWrap:'wrap'}}>
          <button onClick=${doApprove} disabled=${busy} style=${{background:C.ok,color:'#0a1a0a',border:'none',borderRadius:6,padding:'8px 20px',fontSize:13,fontWeight:700,cursor:busy?'default':'pointer',opacity:busy?0.6:1}}>✓ Approve</button>
          <button onClick=${doRevision} disabled=${busy||regenerating} style=${{background:regenerating?`${C.pu}20`:'transparent',color:C.pu,border:`0.5px solid ${C.pu}`,borderRadius:6,padding:'8px 15px',fontSize:13,cursor:(busy||regenerating)?'default':'pointer',opacity:(busy||regenerating)?0.8:1}}>
            ${regenerating?'🤖 Rewriting…':'✏ Request Revision'}
          </button>
          <button onClick=${doReject} disabled=${busy} style=${{background:'transparent',color:C.er,border:`0.5px solid ${C.er}`,borderRadius:6,padding:'8px 15px',fontSize:13,cursor:busy?'default':'pointer',opacity:busy?0.6:1}}>✗ Reject</button>
        </div>
      </div>`:''}

      ${isApproved?html`<div style=${{marginTop:14,paddingTop:14,borderTop:`0.5px solid ${C.bd}`}}>
        <button onClick=${doPublish} disabled=${busy} style=${{background:C.tl,color:'#001a18',border:'none',borderRadius:6,padding:'8px 20px',fontSize:13,fontWeight:700,cursor:busy?'default':'pointer',opacity:busy?0.6:1}}>🚀 Mark as Published</button>
      </div>`:''}
      ${item.status==='published'?html`<div style=${{color:C.tl,fontSize:11,marginTop:10}}>🚀 Published ${fmtdt(item.publishedAt)}</div>`:''}
    </div>
  </div>`;
}

// ── SOCIAL CAPTION CARD ───────────────────────────────────────
function SocialCaptionCard({ca,onUpdate,onDelete}){
  const captionInit=ca.full_content?.caption||ca.preview_text||'';
  const[copyText,setCopyText]=useState(captionInit);
  const[copyNote,setCopyNote]=useState('');
  const[copyEditMode,setCopyEditMode]=useState('manual');
  const[note,setNote]=useState('');
  const[busy,setBusy]=useState(false);
  const[copyVersion,setCopyVersion]=useState(0);
  // Force textarea remount whenever CA caption changes externally (data refresh or AI rewrite saved)
  useEffect(()=>{setCopyText(ca.full_content?.caption||ca.preview_text||'');setCopyVersion(v=>v+1);},[ca.full_content?.caption,ca.preview_text]);
  const[regenerating,setRegenerating]=useState(false);
  const[copied,setCopied]=useState(false);
  const[posting,setPosting]=useState(false);
  const[postResult,setPostResult]=useState(null);
  const[newIgUrl,setNewIgUrl]=useState(ca.full_content?.igVideoUrl||'');
  const[newYtUrl,setNewYtUrl]=useState(ca.full_content?.youtubeUrl||ca.full_content?.youtube_url||'');
  const[copySaveMsg2,setCopySaveMsg2]=useState('');
  const[rejectMode,setRejectMode]=useState(false);
  const[rejectRemark,setRejectRemark]=useState('');
  const[draftSaved,setDraftSaved]=useState(!!(ca.full_content?.draft_saved));
  const[schedDate,setSchedDate]=useState(()=>toMYTParts(ca.scheduled_for).date);
  const[schedTime,setSchedTime]=useState(()=>toMYTParts(ca.scheduled_for).time);
  function schedPatch(){const iso=fromMYTParts(schedDate,schedTime);return iso?{scheduled_for:iso}:{};}

  const drillName=(ca.subject||'').replace(/^TDOW Social Wk\d+:\s*/i,'');
  const caption=ca.full_content?.caption||ca.preview_text||'';
  const yt=ca.full_content?.youtubeUrl||ca.full_content?.youtube_url||'';
  const igV=ca.full_content?.igVideoUrl||'';
  const isActionable=ca.status==='pending'||ca.status==='revision_requested';
  const isApproved=ca.status==='approved';
  const borderColor=ca.status==='pending'?C.bdB:ca.status==='approved'?C.ok+'50':ca.status==='revision_requested'?C.pu+'50':C.bd;
  const st=CA_STATUS_MAP[ca.status]||{l:ca.status,c:C.dm,icon:''};

  async function doReopen(){setBusy(true);await onUpdate(ca.id,{status:'pending',approved_at:null});setBusy(false);}
  async function doPostNow(){
    if(!validateForFire({...ca,content_type:'social'}).ok){alert("⚠️ This post has an issue and can't be posted — resolve it in the Flagged Issue folder first.");return;}
    if(!confirm(`Post Wk${ca.week_number} "${drillName}" to IG + FB right now?`))return;
    setPosting(true);setPostResult(null);
    fetch(`${N8N}/webhook/social-sync-run`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ca_id:ca.id,source:'app4_manual'})}).catch(()=>{});
    setPostResult({ok:true,msg:'Triggered — Telegram will confirm once posted (allow ~3 min for IG Reel processing)'});
    setPosting(false);
  }
  async function copyCaption(){try{await navigator.clipboard.writeText(caption);setCopied(true);setTimeout(()=>setCopied(false),2000);}catch{}}

  function flashMsg(msg){setCopySaveMsg2(msg);setTimeout(()=>setCopySaveMsg2(''),3000);}
  async function doRequestCopyRevision(){
    if(copyEditMode==='manual'){
      setBusy(true);
      const fc={...ca.full_content,caption:copyText,draft_saved:true};
      await onUpdate(ca.id,{full_content:fc,preview_text:copyText});
      setDraftSaved(true);
      flashMsg('✓ Caption saved');
      setBusy(false);
    }else{
      if(!copyNote.trim()){alert('Add revision notes so Claude knows what to change.');return;}
      setRegenerating(true);
      const sys='You are an expert social media copywriter for Titan Ball Machines MY, a pickleball equipment brand in Malaysia. Write engaging, energetic captions for Instagram and Facebook.';
      const usr=`Rewrite the following Instagram/Facebook caption based on the reviewer feedback.\n\nDrill topic: ${drillName}\nScheduled: ${ca.scheduled_for?new Date(ca.scheduled_for).toDateString():''}\n\nCurrent caption:\n${copyText||'(no caption yet)'}\n\nRevision notes: ${copyNote}\n\nWrite ONLY the revised caption. Preserve any YouTube link and hashtags format. No preamble or labels.`;
      try{
        const res=await fetch(`${N8N}/webhook/claude-proxy`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system:sys,prompt:usr})});
        const raw=await res.text();
        let data;try{data=JSON.parse(raw);}catch{throw new Error('Bad response: '+raw.slice(0,100));}
        const newText=(data?.content?.[0]?.text||data?.[0]?.content?.[0]?.text||data?.body?.content?.[0]?.text||'').trim();
        if(newText){
          setCopyText(newText);
          setCopyVersion(v=>v+1);
          setCopyEditMode('manual');
          const fc={...ca.full_content,caption:newText,draft_saved:true};
          await onUpdate(ca.id,{full_content:fc,preview_text:newText});
          setCopyNote('');setDraftSaved(true);
          flashMsg('✓ AI caption saved — review above');
        }else{alert('Claude returned empty response.');}
      }catch(e){alert('Copy revision failed: '+e.message);}
      setRegenerating(false);
    }
  }
  async function doSaveAsDraft(){
    setBusy(true);
    const fc={...ca.full_content,caption:copyText,draft_saved:true,
      igVideoUrl:newIgUrl||ca.full_content?.igVideoUrl||'',
      youtubeUrl:newYtUrl||ca.full_content?.youtubeUrl||ca.full_content?.youtube_url||''};
    await onUpdate(ca.id,{full_content:fc,preview_text:copyText,...schedPatch()});
    setDraftSaved(true);setBusy(false);
  }
  async function doSaveAndApprove(){
    setBusy(true);
    const fc={...ca.full_content,caption:copyText,
      igVideoUrl:newIgUrl||ca.full_content?.igVideoUrl||'',
      youtubeUrl:newYtUrl||ca.full_content?.youtubeUrl||ca.full_content?.youtube_url||''};
    const sp=schedPatch();
    await onUpdate(ca.id,{status:'approved',approved_at:new Date().toISOString(),full_content:fc,preview_text:copyText,...sp});
    const _v=validateForFire({...ca,status:'approved',content_type:'social',full_content:fc,preview_text:copyText,scheduled_for:sp.scheduled_for||ca.scheduled_for});
    if(!_v.ok)alert("✅ Approved — but it WON'T fire as-is:\n\n• "+_v.reasons.join("\n• ")+"\n\nIt's held OUT of the Schedule until fixed. 🛠 system issues self-heal; ⚠️ items need you.");
    setBusy(false);
  }
  async function doConfirmReject(){
    if(!rejectRemark.trim()&&!confirm('Reject without a reason?'))return;
    setBusy(true);
    const fc={...ca.full_content,rejection_reason:rejectRemark};
    await onUpdate(ca.id,{status:'skipped',full_content:fc});
    setRejectMode(false);setBusy(false);
  }

  async function doRevise(){
    if(!note.trim()){alert('Add revision notes — Claude will rewrite the caption.');return;}
    setRegenerating(true);
    const sys='You are an expert social media copywriter for Titan Ball Machines MY, a pickleball equipment brand in Malaysia. Write engaging, energetic captions for Instagram and Facebook.';
    const usr=`Rewrite the following Instagram/Facebook caption based on the reviewer feedback.\n\nDrill topic: ${drillName}\nScheduled: ${ca.scheduled_for?new Date(ca.scheduled_for).toDateString():''}\n\nCurrent caption:\n${caption}\n\nRevision notes: ${note}\n\nWrite ONLY the revised caption. Preserve the YouTube link and hashtags format. No preamble or labels.`;
    try{
      const res=await fetch(`${N8N}/webhook/claude-proxy`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system:sys,prompt:usr})});
      const raw=await res.text();
      let data;try{data=JSON.parse(raw);}catch{throw new Error('Bad response: '+raw.slice(0,100));}
      const newText=(data?.content?.[0]?.text||data?.[0]?.content?.[0]?.text||data?.body?.content?.[0]?.text||'').trim();
      if(newText){await onUpdate(ca.id,{status:'pending',full_content:{...ca.full_content,caption:newText},preview_text:newText});setNote('');}
      else{alert('Claude returned empty response.');}
    }catch(e){alert('Revision failed: '+e.message);}
    setRegenerating(false);
  }

  return html`<div style=${{background:C.s1,border:`0.5px solid ${borderColor}`,borderRadius:10,marginBottom:12,overflow:'hidden',animation:'fadeIn 0.2s ease'}}>
    <div style=${{padding:'12px 16px',display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:12,borderBottom:`0.5px solid ${C.bd}`}}>
      <div style=${{flex:1,minWidth:0}}>
        <div style=${{display:'flex',alignItems:'center',gap:7,flexWrap:'wrap',marginBottom:4}}>
          <span style=${{background:'rgba(251,146,60,0.15)',color:'#fb923c',border:'0.5px solid rgba(251,146,60,0.35)',borderRadius:10,padding:'2px 9px',fontSize:10,fontWeight:700}}>📸📘 TDOW Social</span>
          <span style=${{color:C.or,fontWeight:800,fontSize:12}}>Wk ${ca.week_number}</span>
          <span style=${{color:C.tx,fontWeight:600,fontSize:14}}>${drillName}</span>
        </div>
        <div style=${{color:C.mt,fontSize:11}}>📅 ${fmtDay(ca.scheduled_for)} · Instagram Reel + Facebook Post</div>
      </div>
      <div style=${{display:'flex',alignItems:'center',gap:6,flexShrink:0}}>
        ${(isActionable&&draftSaved)&&html`<span style=${{background:'rgba(251,191,36,0.12)',color:'#fbbf24',border:'0.5px solid rgba(251,191,36,0.3)',borderRadius:10,padding:'2px 8px',fontSize:10,fontWeight:600}}>📝 Saved Revision</span>`}
        <span style=${{background:`${st.c}15`,color:st.c,border:`0.5px solid ${st.c}35`,borderRadius:20,padding:'3px 10px',fontSize:11,fontWeight:600,whiteSpace:'nowrap'}}>${st.icon} ${st.l}</span>
      </div>
    </div>

    <div style=${{padding:'14px 16px'}}>
      ${isActionable
        ?html`<div>

          <!-- ── COPY EDIT ── -->
          <div style=${{marginBottom:0}}>
            <div style=${{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
              <span style=${{fontSize:11,fontWeight:700,color:C.dm,letterSpacing:'0.4px',textTransform:'uppercase'}}>📝 Copy Edit</span>
              <div style=${{display:'flex',background:C.s3,borderRadius:5,padding:2,border:`0.5px solid ${C.bd}`}}>
                <button onClick=${()=>setCopyEditMode('manual')} style=${{background:copyEditMode==='manual'?C.s1:'transparent',border:'none',borderRadius:3,color:copyEditMode==='manual'?C.tx:C.mt,padding:'3px 10px',fontSize:11,cursor:'pointer',fontWeight:copyEditMode==='manual'?600:400,transition:'all 0.15s'}}>✏ Edit Directly</button>
                <button onClick=${()=>setCopyEditMode('ai')} style=${{background:copyEditMode==='ai'?C.s1:'transparent',border:'none',borderRadius:3,color:copyEditMode==='ai'?C.tx:C.mt,padding:'3px 10px',fontSize:11,cursor:'pointer',fontWeight:copyEditMode==='ai'?600:400,transition:'all 0.15s'}}>🤖 AI Feedback</button>
              </div>
            </div>
            ${copyEditMode==='manual'
              ?html`<textarea key=${copyVersion} defaultValue=${copyText} onChange=${e=>setCopyText(e.target.value)}
                  placeholder="Type the post caption here — what will be published to IG + FB…"
                  style=${{background:C.s2,border:`1px solid ${C.bdB}`,borderRadius:6,padding:'10px 12px',fontSize:12,lineHeight:1.75,color:C.tx,width:'100%',resize:'vertical',minHeight:140,outline:'none'}}/>`
              :html`<textarea value=${copyNote} onInput=${e=>setCopyNote(e.target.value)}
                  placeholder="Describe what to change — tone, angle, what to add or remove, key message…"
                  style=${{background:C.s2,border:`1px solid ${C.bdB}`,borderRadius:6,padding:'10px 12px',fontSize:12,lineHeight:1.6,color:C.tx,width:'100%',resize:'vertical',minHeight:80,outline:'none'}}/>`
            }
            <button onClick=${doRequestCopyRevision} disabled=${busy||regenerating}
              style=${{marginTop:8,background:`${C.ac}14`,color:C.ac,border:`0.5px solid ${C.ac}45`,borderRadius:6,padding:'7px 16px',fontSize:12,fontWeight:600,cursor:(busy||regenerating)?'default':'pointer',opacity:(busy||regenerating)?0.6:1}}>
              ${regenerating?'🤖 Rewriting…':(busy?'Saving…':(copyEditMode==='ai'?'🤖 Request Copy Revision':'💾 Request Copy Revision'))}
            </button>
            ${copySaveMsg2&&html`<span style=${{display:'block',marginTop:7,color:C.ok,fontSize:12,fontWeight:600}}>${copySaveMsg2}</span>`}
          </div>

          <!-- ── IMAGE / VIDEO / GRAPHICS EDIT ── -->
          <div style=${{borderTop:`0.5px solid ${C.bd}`,paddingTop:14,marginTop:14}}>
            <span style=${{fontSize:11,fontWeight:700,color:C.dm,letterSpacing:'0.4px',textTransform:'uppercase',display:'block',marginBottom:10}}>📹 Image / Video / Graphics Edit</span>
            <div style=${{fontSize:11,color:C.mt,marginBottom:10}}>Update video URLs if you want to swap to a different clip. Leave blank to keep current values from Google Sheets.</div>
            <div style=${{marginBottom:8}}>
              <label style=${{display:'block',fontSize:11,color:C.dm,marginBottom:4}}>IG Reel Video URL (Bunny CDN / Drive link):</label>
              <input value=${newIgUrl} onInput=${e=>setNewIgUrl(e.target.value)}
                placeholder="${igV||'No IG video URL currently set'}"
                style=${{background:C.s2,border:`1px solid ${C.bdB}`,borderRadius:6,padding:'7px 10px',fontSize:11,color:C.tx,width:'100%',outline:'none'}}/>
            </div>
            <div>
              <label style=${{display:'block',fontSize:11,color:C.dm,marginBottom:4}}>YouTube URL (for caption link):</label>
              <input value=${newYtUrl} onInput=${e=>setNewYtUrl(e.target.value)}
                placeholder="${yt||'No YouTube URL currently set'}"
                style=${{background:C.s2,border:`1px solid ${C.bdB}`,borderRadius:6,padding:'7px 10px',fontSize:11,color:C.tx,width:'100%',outline:'none'}}/>
            </div>
          </div>

          <!-- ── SCHEDULE (MYT) ── -->
          <div style=${{borderTop:`0.5px solid ${C.bd}`,paddingTop:14,marginTop:14}}>
            <span style=${{fontSize:11,fontWeight:700,color:C.dm,letterSpacing:'0.4px',textTransform:'uppercase',display:'block',marginBottom:8}}>📅 Post Schedule (Malaysia time)</span>
            <div style=${{display:'flex',gap:8,flexWrap:'wrap'}}>
              <input type="date" value=${schedDate} onChange=${e=>setSchedDate(e.target.value)} style=${{background:C.s2,border:`1px solid ${C.bdB}`,borderRadius:6,padding:'7px 10px',fontSize:12,color:C.tx,outline:'none',flex:'1 1 160px'}}/>
              <input type="time" value=${schedTime} onChange=${e=>setSchedTime(e.target.value)} style=${{background:C.s2,border:`1px solid ${C.bdB}`,borderRadius:6,padding:'7px 10px',fontSize:12,color:C.tx,outline:'none',flex:'0 1 130px'}}/>
            </div>
            <div style=${{color:C.mt,fontSize:10,marginTop:6}}>Saved with Save / Approve. Sets the schedule shown across Schedule &amp; Deployments tabs.</div>
          </div>

          <!-- ── BOTTOM ACTIONS ── -->
          <div style=${{borderTop:`0.5px solid ${C.bd}`,paddingTop:14,marginTop:14}}>
            ${rejectMode
              ?html`<div>
                <div style=${{color:C.er,fontSize:12,marginBottom:7,fontWeight:600}}>Why are you rejecting this? (saved for future reference)</div>
                <textarea value=${rejectRemark} onInput=${e=>setRejectRemark(e.target.value)} autoFocus
                  placeholder="e.g. Campaign plan changed, wrong concept, replaced with different approach…"
                  style=${{background:C.s2,border:`1px solid ${C.er}50`,borderRadius:6,color:C.tx,padding:'8px 11px',fontSize:12,width:'100%',resize:'vertical',minHeight:60,outline:'none',marginBottom:10,lineHeight:1.5}}/>
                <div style=${{display:'flex',gap:8}}>
                  <button onClick=${doConfirmReject} disabled=${busy} style=${{background:`${C.er}14`,color:C.er,border:`0.5px solid ${C.er}50`,borderRadius:6,padding:'7px 16px',fontSize:12,fontWeight:600,cursor:busy?'default':'pointer',opacity:busy?0.6:1}}>Confirm Reject</button>
                  <button onClick=${()=>{setRejectMode(false);setRejectRemark('');}} style=${{background:'transparent',color:C.dm,border:`0.5px solid ${C.bd}`,borderRadius:6,padding:'7px 14px',fontSize:12,cursor:'pointer'}}>Cancel</button>
                </div>
              </div>`
              :html`<div style=${{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
                <button onClick=${doSaveAsDraft} disabled=${busy} style=${{background:`${C.ac}12`,color:C.ac,border:`0.5px solid ${C.ac}45`,borderRadius:6,padding:'8px 18px',fontSize:13,fontWeight:600,cursor:busy?'default':'pointer',opacity:busy?0.6:1}}>
                  ${busy?'Saving…':'💾 Save as Draft'}
                </button>
                <button onClick=${doSaveAndApprove} disabled=${busy} style=${{background:C.ok,color:'#0a1a0a',border:'none',borderRadius:6,padding:'8px 20px',fontSize:13,fontWeight:700,cursor:busy?'default':'pointer',opacity:busy?0.6:1}}>
                  ✓ Save & Approve
                </button>
                <button onClick=${()=>setRejectMode(true)} style=${{background:'transparent',color:C.er,border:`0.5px solid ${C.er}45`,borderRadius:6,padding:'8px 15px',fontSize:13,cursor:'pointer'}}>
                  ✗ Reject
                </button>
              </div>`
            }
          </div>
        </div>`
        :html`<div>
          <div style=${{background:C.s2,border:`0.5px solid ${isApproved?C.ok+'50':C.bd}`,borderRadius:8,padding:'12px 14px',fontSize:13,lineHeight:1.75,color:C.tx,whiteSpace:'pre-wrap',maxHeight:220,overflowY:'auto'}}>
            ${caption||'No caption set.'}
          </div>
          <div style=${{display:'flex',justifyContent:'flex-end',gap:7,marginTop:6}}>
            <button onClick=${copyCaption} style=${{background:'transparent',border:`0.5px solid ${C.bd}`,borderRadius:5,color:copied?C.ok:C.dm,padding:'4px 10px',fontSize:11,cursor:'pointer'}}>${copied?'✓ Copied':'Copy text'}</button>
          </div>
          <div style=${{marginTop:8,padding:'7px 10px',background:C.s2+'60',borderRadius:6,fontSize:11,color:C.dm,lineHeight:1.8}}>
            ${yt?html`<div>▶️ <a href=${yt} target="_blank" style=${{color:C.ac,textDecoration:'none'}}>${yt}</a></div>`:''}
            ${igV?html`<div>📱 IG Reel: <span style=${{color:C.tl}}>${igV.split('/').pop()}</span></div>`:''}
          </div>
        </div>`
      }
      ${isApproved?html`<div style=${{marginTop:14,paddingTop:14,borderTop:`0.5px solid ${C.bd}`}}>
        <div style=${{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap',marginBottom:8}}>
          <span style=${{color:C.ok,fontSize:12}}>✓ Approved — fires Wednesday ${fmtDay(ca.scheduled_for)}</span>
          <button onClick=${doPostNow} disabled=${busy||posting} style=${{background:posting?'transparent':`${C.ok}18`,color:C.ok,border:`0.5px solid ${C.ok}50`,borderRadius:6,padding:'5px 14px',fontSize:12,fontWeight:700,cursor:(busy||posting)?'default':'pointer',opacity:(busy||posting)?0.6:1}}>
            ${posting?'⏳ Firing…':'🚀 Post Now'}
          </button>
          <button onClick=${doReopen} disabled=${busy} style=${{background:'transparent',color:C.dm,border:`0.5px solid ${C.bd}`,borderRadius:6,padding:'5px 12px',fontSize:11,cursor:'pointer',opacity:busy?0.6:1}}>Re-open for Revision</button>
        </div>
        ${postResult?html`<div style=${{padding:'6px 10px',borderRadius:6,background:postResult.ok?`${C.ok}12`:`${C.er}12`,color:postResult.ok?C.ok:C.er,fontSize:11,marginBottom:8}}>${postResult.ok?'✓ ':'✗ '}${postResult.msg}</div>`:''}
        <div style=${{borderTop:`0.5px solid ${C.bd}`,paddingTop:10,marginTop:4}}>
          <textarea placeholder="Caption revision notes for AI rewrite — describe what to change…" value=${note} onInput=${e=>setNote(e.target.value)}
            style=${{background:C.s2,border:`0.5px solid ${C.bd}`,borderRadius:6,color:C.tx,padding:'8px 11px',fontSize:11,width:'100%',resize:'vertical',minHeight:44,outline:'none',marginBottom:7,lineHeight:1.5}}/>
          <button onClick=${doRevise} disabled=${busy||regenerating} style=${{background:regenerating?`${C.pu}20`:'transparent',color:C.pu,border:`0.5px solid ${C.pu}`,borderRadius:6,padding:'6px 14px',fontSize:12,cursor:(busy||regenerating)?'default':'pointer',opacity:(busy||regenerating)?0.8:1}}>
            ${regenerating?'🤖 Rewriting…':'✏ Revise Caption with AI'}
          </button>
          <span style=${{color:C.mt,fontSize:10,marginLeft:8}}>Rewrite drops back to pending for re-approval.</span>
        </div>
      </div>`:''}
      ${ca.status==='skipped'?html`<div style=${{marginTop:14,paddingTop:14,borderTop:`0.5px solid ${C.bd}`,display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
        <span style=${{color:C.er,fontSize:12}}>✗ Skipped — will not post this Wednesday</span>
        <button onClick=${doReopen} disabled=${busy} style=${{background:'transparent',color:C.dm,border:`0.5px solid ${C.bd}`,borderRadius:6,padding:'5px 12px',fontSize:11,cursor:'pointer'}}>Restore</button>
        ${onDelete&&html`<button onClick=${()=>{if(confirm('Permanently DELETE this rejected caption from the database?\n\nThis cannot be undone.'))onDelete(ca.id);}} style=${{background:'transparent',color:C.er,border:`0.5px solid ${C.er}45`,borderRadius:6,padding:'5px 12px',fontSize:11,cursor:'pointer'}}>🗑️ Delete</button>`}
      </div>`:''}
    </div>
  </div>`;
}

// ── EMAIL SERIES CARD ─────────────────────────────────────────
// Generic: works for ANY email series (identified by subject/series title), not just TDOW.
// content_approvals is the single source of truth; Brevo is send-only.
function EmailCard({ca,onUpdate,onDelete}){
  const[subj,setSubj]=useState(ca.full_content?.emailSubject||ca.subject||'');
  const[body,setBody]=useState(ca.full_content?.drillDescription||ca.full_content?.emailBody||'');
  const[copyNote,setCopyNote]=useState('');
  const[copyEditMode,setCopyEditMode]=useState('manual');
  const[busy,setBusy]=useState(false);
  const[regenerating,setRegenerating]=useState(false);
  const[bodyVersion,setBodyVersion]=useState(0);
  const[subjVersion,setSubjVersion]=useState(0);
  const[newYt,setNewYt]=useState(ca.full_content?.youtubeUrl||ca.full_content?.youtube_url||'');
  const[newDrive,setNewDrive]=useState(ca.full_content?.driveVideoUrl||'');
  const[saveMsg,setSaveMsg]=useState('');
  const[rejectMode,setRejectMode]=useState(false);
  const[rejectRemark,setRejectRemark]=useState('');
  const[draftSaved,setDraftSaved]=useState(!!(ca.full_content?.draft_saved));
  const[blasting,setBlasting]=useState(false);
  const[blastResult,setBlastResult]=useState(null);
  const[note,setNote]=useState('');
  const[testEmail,setTestEmail]=useState(()=>{try{return localStorage.getItem('omnira_test_email')||''}catch(e){return ''}});
  const[testSending,setTestSending]=useState(false);
  const[testResult,setTestResult]=useState(null);
  const[previewing,setPreviewing]=useState(false);
  const[previewDoc,setPreviewDoc]=useState(null);
  // Composer-only editable fields (full App 2 parity) — banner, CTA buttons, footer, send list
  const[banner,setBanner]=useState(ca.full_content?.bannerImage||'');
  const[ctas,setCtas]=useState(()=>Array.isArray(ca.full_content?.ctaButtons)?ca.full_content.ctaButtons.map(c=>({label:c.label||'',url:c.url||'',desc:c.desc||''})):[]);
  const[footer,setFooter]=useState(ca.full_content?.footer||'');
  const[sendList,setSendList]=useState(ca.full_content?.sendListId||'titan_active');
  // Editable schedule (MYT)
  const[schedDate,setSchedDate]=useState(()=>toMYTParts(ca.scheduled_for).date);
  const[schedTime,setSchedTime]=useState(()=>toMYTParts(ca.scheduled_for).time);
  // Resync when CA changes externally (refresh / AI save)
  useEffect(()=>{setSubj(ca.full_content?.emailSubject||ca.subject||'');setSubjVersion(v=>v+1);},[ca.full_content?.emailSubject,ca.subject]);
  useEffect(()=>{setBody(ca.full_content?.drillDescription||ca.full_content?.emailBody||'');setBodyVersion(v=>v+1);},[ca.full_content?.drillDescription,ca.full_content?.emailBody]);

  const pieceTitle=ca.full_content?.drillName||(ca.subject||'').replace(/^.*?Wk\d+:\s*/i,'')||'Untitled';
  const yt=ca.full_content?.youtubeUrl||ca.full_content?.youtube_url||'';
  const drive=ca.full_content?.driveVideoUrl||'';
  const isActionable=ca.status==='pending'||ca.status==='revision_requested';
  const isApproved=ca.status==='approved';
  const isComposer=ca.full_content?.created_via==='app2_composer'||!ca.week_number;
  const seriesLabel=isComposer?(ca.full_content?.seriesName||'Email Broadcast'):'Drill of the Week';
  const borderColor=ca.status==='pending'?C.bdB:ca.status==='approved'?C.ok+'50':ca.status==='revision_requested'?C.pu+'50':C.bd;
  const st=CA_STATUS_MAP[ca.status]||{l:ca.status,c:C.dm,icon:''};

  function flashMsg(msg){setSaveMsg(msg);setTimeout(()=>setSaveMsg(''),3000);}
  // Dual-write body to BOTH fields — broadcast sender reads emailBody first, drip reads drillDescription (single source of truth).
  // Composer emails also persist banner/CTAs/footer/sendList (full App 2 parity); TDOW drip ignores these (fixed template).
  function buildFC(extra={}){
    const base={...ca.full_content,emailSubject:subj,drillDescription:body,emailBody:body,youtubeUrl:newYt,driveVideoUrl:newDrive};
    if(isComposer){
      base.bannerImage=banner;

  async function doBlastNow(){

    const url=isComposer?`${N8N}/webhook/email-broadcast-run`:`${N8N}/webhook/email-blast-run`;
    const payload={ca_id:ca.id,source:'app4_manual'};
    fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).catch(()=>{});
    setBlastResult({ok:true,msg:'Triggered — Telegram will confirm once the Brevo blast completes.'});
    setBlasting(false);
  }
  async function doTestSend(){
    const addr=testEmail.trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(addr)){setTestResult({ok:false,msg:'Enter a valid email address first.'});return;}
    setTestSending(true);setTestResult(null);
    try{
      // Save on-screen edits first so the test reflects exactly what's in the editor
      if(isActionable){await onUpdate(ca.id,{full_content:buildFC({draft_saved:true}),subject:subj||ca.subject,preview_text:body});setDraftSaved(true);}
      try{localStorage.setItem('omnira_test_email',addr);}catch(e){}
      // Composer emails → generic broadcast (by ca_id). TDOW drip → drip pipeline (by week) with its real template.
      const url=isComposer?`${N8N}/webhook/email-broadcast-run`:`${N8N}/webhook/email-blast-run`;
      const payload=isComposer?{ca_id:ca.id,test_email:addr,source:'app4_test'}:{weekOverride:ca.week_number,test_email:addr,source:'app4_test'};
      const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      let data=null;try{data=await res.json();}catch(e){}
      const item=Array.isArray(data)?data[0]:data;
      if(res.ok&&item&&item.ok&&item.sent>0)setTestResult({ok:true,msg:`Test sent to ${addr} — check the inbox (and spam). The live list was NOT touched.`});
      else if(res.ok)setTestResult({ok:true,msg:'Triggered — Telegram will confirm the test result.'});

    try{
