<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OmniraAI — Content Approval</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#05080f;color:#cfe0f5;}
input,select,textarea,button{font-family:inherit;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#1a3055;border-radius:3px;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.5;}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3/dist/htm.js"></script>
<script>
const{useState,useEffect,useCallback,useRef}=React;
const html=htm.bind(React.createElement);

// ── SUPABASE ────────────────────────────────────────────────
const SB_URL='https://vchtdsfrryxnvceierkn.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZjaHRkc2Zycnl4bnZjZWllcmtuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0ODcyMTYsImV4cCI6MjA5NDA2MzIxNn0.VuPuPqCbVYlxNpeTulkKK-IMezzxg3C05c4kWn3evqo';
const SBH={'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json'};
const N8N='https://n8n-y8wq-production.up.railway.app';

const db={
  async getQueue(){
    try{const r=await fetch(`${SB_URL}/rest/v1/content_queue?select=*&order=created_at.desc`,{headers:SBH});const d=await r.json();return Array.isArray(d)?d.map(x=>x.data).filter(Boolean):[];}catch{return[];}
  },
  async updateItem(item){
    try{await fetch(`${SB_URL}/rest/v1/content_queue`,{method:'POST',headers:{...SBH,'Prefer':'resolution=merge-duplicates'},body:JSON.stringify({id:item.id,updated_at:item.updatedAt,client_id:item.clientId,campaign_id:item.campaignId||null,status:item.status,data:item})});}catch(e){console.error(e);}
  },
  async deleteItem(id){
    try{await fetch(`${SB_URL}/rest/v1/content_queue?id=eq.${id}`,{method:'DELETE',headers:SBH});}catch(e){console.error(e);}
  },
  async getClients(){
    try{const r=await fetch(`${SB_URL}/rest/v1/clients?select=*&order=created_at.desc`,{headers:SBH});const d=await r.json();return Array.isArray(d)?d.map(x=>x.data).filter(Boolean):[];}catch{return[];}
  },
  async logRevision(rev){
    try{await fetch(`${SB_URL}/rest/v1/revision_history`,{method:'POST',headers:{...SBH,'Prefer':'resolution=merge-duplicates'},body:JSON.stringify(rev)});}catch(e){console.error(e);}
  },
  async getRevisions(queueItemId){
    try{const r=await fetch(`${SB_URL}/rest/v1/revision_history?queue_item_id=eq.${encodeURIComponent(queueItemId)}&order=created_at.desc`,{headers:SBH});const d=await r.json();return Array.isArray(d)?d:[];}catch{return[];}
  },
  // Media asset methods
  async getMediaAssets(filters={}){
    try{
      let q=`${SB_URL}/rest/v1/campaign_assets?select=*&order=created_at.desc`;
      if(filters.status&&filters.status!=='all')q+=`&status=eq.${filters.status}`;
      if(filters.campaign_id)q+=`&campaign_id=eq.${filters.campaign_id}`;
      if(filters.client_id)q+=`&client_id=eq.${filters.client_id}`;
      const r=await fetch(q,{headers:SBH});
      const d=await r.json();
      return Array.isArray(d)?d:[];
    }catch{return[];}
  },
  async updateAsset(asset){
    try{
      await fetch(`${SB_URL}/rest/v1/campaign_assets?id=eq.${asset.id}`,{
        method:'PATCH',headers:{...SBH,'Prefer':'return=minimal'},
        body:JSON.stringify({...asset,updated_at:new Date().toISOString()})
      });
    }catch(e){console.error(e);}
  },
  async logAssetRevision(rev){
    try{await fetch(`${SB_URL}/rest/v1/asset_revisions`,{method:'POST',headers:{...SBH,'Prefer':'resolution=merge-duplicates'},body:JSON.stringify(rev)});}catch(e){console.error(e);}
  },
  async getAssetRevisions(assetId){
    try{const r=await fetch(`${SB_URL}/rest/v1/asset_revisions?asset_id=eq.${assetId}&order=revision_number.desc`,{headers:SBH});return await r.json();}catch{return[];}
  },
  // Sync asset approval status back to content_approvals (for real_gains series)
  async syncContentApproval(assetId, status){
    try{
      const statusMap={approved:'approved',rejected:'skipped',revision_requested:'revision_requested'};
      const caStatus=statusMap[status];
      if(!caStatus)return;
      const r=await fetch(`${SB_URL}/rest/v1/content_approvals?content_type=eq.real_gains&select=id,full_content`,{headers:SBH});
      const d=await r.json();
      if(!Array.isArray(d))return;
      const linked=d.find(a=>a.full_content?.asset_id===assetId);
      if(!linked)return;
      const patch={status:caStatus,updated_at:new Date().toISOString()};
      if(caStatus==='approved')patch.approved_at=new Date().toISOString();
      await fetch(`${SB_URL}/rest/v1/content_approvals?id=eq.${linked.id}`,{
        method:'PATCH',headers:{...SBH,'Prefer':'return=minimal'},
        body:JSON.stringify(patch)
      });
      console.log('content_approvals synced:',linked.id,'→',caStatus);
    }catch(e){console.error('syncContentApproval error:',e);}
  },
  async uploadToStorage(file,path){
    try{
      const r=await fetch(`${SB_URL}/storage/v1/object/campaign-assets/${path}`,{
        method:'POST',
        headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Content-Type':file.type,'x-upsert':'true'},
        body:file
      });
      const d=await r.json();
      return d.Key?`${SB_URL}/storage/v1/object/public/${d.Key}`:null;
    }catch(e){console.error('Storage upload failed:',e);return null;}
  },
};

// ── TOKENS ──────────────────────────────────────────────────
const C={bg:'#05080f',s1:'#0a1020',s2:'#0e1830',s3:'#13213e',bd:'#17304e',bdB:'#1d4070',ac:'#4a86f5',tx:'#cfe0f5',dm:'#5a8ab0',mt:'#274466',ok:'#34d399',wn:'#fbbf24',er:'#f87171',pu:'#a78bfa',tl:'#2dd4bf',or:'#fb923c'};

const STATUS={
  pending_review:     {l:'Pending Review',    c:C.wn, bg:'rgba(251,191,36,0.10)',  icon:'⏳'},
  generating:         {l:'Generating',        c:C.ac, bg:'rgba(74,134,245,0.10)',  icon:'🤖'},
  revision_requested: {l:'Revision Needed',   c:C.pu, bg:'rgba(167,139,250,0.10)',icon:'✏️'},
  approved:           {l:'Approved',          c:C.ok, bg:'rgba(52,211,153,0.10)',  icon:'✓'},
  rejected:           {l:'Rejected',          c:C.er, bg:'rgba(248,113,113,0.10)',icon:'✗'},
  published:          {l:'Published',         c:C.tl, bg:'rgba(45,212,191,0.10)',  icon:'🚀'},
};

const FORMATS={
  ig_caption:{icon:'📸',label:'Instagram Caption'},tiktok_caption:{icon:'🎵',label:'TikTok Caption'},
  fb_caption:{icon:'📘',label:'Facebook Caption'},ad_hook:{icon:'🎣',label:'Ad Hook'},
  ad_headline:{icon:'📢',label:'Ad Headline'},ad_body:{icon:'📝',label:'Ad Body Copy'},
  email_subject:{icon:'📧',label:'Email Subject'},email_preview:{icon:'👁',label:'Email Preview'},
  email_body:{icon:'📨',label:'Email Body'},whatsapp:{icon:'💬',label:'WhatsApp Message'},
  shopee_title:{icon:'🛍',label:'Shopee Title'},shopee_desc:{icon:'🛒',label:'Shopee Description'},
  story_script:{icon:'🎬',label:'Story/Reel Script'},sms_blast:{icon:'📱',label:'SMS Blast'},
  linkedin_post:{icon:'💼',label:'LinkedIn Post'},
};

const CHANNEL_META={
  ig_post:      {icon:'📸',label:'IG Post',      dims:'1:1 or 4:5',  type:'image'},
  ig_story:     {icon:'📱',label:'IG Story',     dims:'9:16',         type:'image_video'},
  ig_reel:      {icon:'🎬',label:'IG Reel',      dims:'9:16 video',   type:'video'},
  fb_post:      {icon:'📘',label:'FB Post',      dims:'1.91:1',       type:'image'},
  tiktok:       {icon:'🎵',label:'TikTok',       dims:'9:16 video',   type:'video'},
  email_header: {icon:'📧',label:'Email Header', dims:'600×200px',    type:'image'},
  wa_poster:    {icon:'💬',label:'WA Poster',    dims:'9:16 or 1:1',  type:'image'},
};

const now=()=>new Date().toISOString();
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const fmtdt=d=>d?new Date(d).toLocaleString('en-MY',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
const varLabel=i=>String.fromCharCode(65+i);

// ── SHARED UI ────────────────────────────────────────────────
function Spinner({msg='Loading…'}){return html`<div style=${{display:'flex',alignItems:'center',justifyContent:'center',gap:10,padding:'80px 20px',color:C.dm,fontSize:13}}>
  <div style=${{width:18,height:18,border:`2px solid ${C.bd}`,borderTop:`2px solid ${C.ac}`,borderRadius:'50%',animation:'spin 0.8s linear infinite'}}></div>${msg}
</div>`;}

function Badge({status}){
  const s=STATUS[status]||{l:status,c:C.dm,bg:'transparent',icon:''};
  return html`<span style=${{background:s.bg,color:s.c,border:`0.5px solid ${s.c}40`,borderRadius:20,padding:'3px 10px',fontSize:11,fontWeight:600,letterSpacing:'0.3px',whiteSpace:'nowrap'}}>${s.icon} ${s.l}</span>`;
}

// ── MEDIA ASSET CARD ─────────────────────────────────────────
function MediaAssetCard({asset,onUpdate}){
  const[feedback,setFeedback]=useState(asset.feedback||'');
  const[revisions,setRevisions]=useState([]);
  const[showHistory,setShowHistory]=useState(false);
  const[historyLoaded,setHistoryLoaded]=useState(false);
  const[regenerating,setRegenerating]=useState(false);
  const[uploading,setUploading]=useState(false);
  const[imgError,setImgError]=useState(false);
  const[referenceImage,setReferenceImage]=useState(null);
  const[refDragging,setRefDragging]=useState(false);
  const[editingPrompt,setEditingPrompt]=useState(false);
  const[editedPrompt,setEditedPrompt]=useState(asset.prompt||'');
  const[restoring,setRestoring]=useState(false);
  const fileRef=useRef(null);
  const refInputRef=useRef(null);

  const ch=CHANNEL_META[asset.channel]||{icon:'🖼',label:asset.channel,dims:'',type:'image'};
  const isVideo=asset.asset_type==='video'||asset.asset_url?.match(/\.(mp4|mov|webm)/i);
  const isActionable=['pending_review','revision_requested'].includes(asset.status);
  const isApproved=asset.status==='approved';
  const borderColor=asset.status==='pending_review'?C.bdB:asset.status==='approved'?C.ok+'50':asset.status==='revision_requested'?C.pu+'50':C.bd;

  async function loadHistory(){
    const r=await db.getAssetRevisions(asset.id);
    setRevisions(r);setHistoryLoaded(true);
  }
  async function toggleHistory(){
    const next=!showHistory;setShowHistory(next);
    if(next&&!historyLoaded)await loadHistory();
  }

  async function doApprove(){
    await onUpdate({...asset,status:'approved',approved_at:now(),feedback:feedback||null});
  }
  async function doReject(){
    await onUpdate({...asset,status:'rejected',feedback:feedback||null});
  }
  function handleRefFiles(files){
    const file=[...files].find(f=>f.type.startsWith('image/'));
    if(!file)return;
    // Resize large images to max 1024px before encoding (keeps payload small)
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=1024;
        let{width:w,height:h}=img;
        if(w>MAX||h>MAX){const s=Math.min(MAX/w,MAX/h);w=Math.round(w*s);h=Math.round(h*s);}
        const canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        setReferenceImage(canvas.toDataURL('image/jpeg',0.85));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  }
  function handleRefDrop(e){
    e.preventDefault();setRefDragging(false);
    handleRefFiles(e.dataTransfer.files);
  }
  function handleRefPaste(e){
    const items=e.clipboardData?.items;
    if(!items)return;
    const imgItem=[...items].find(i=>i.type.startsWith('image/'));
    if(imgItem){e.preventDefault();handleRefFiles([imgItem.getAsFile()]);}
  }

  async function doRequestRevision(){
    if(!feedback.trim()){alert('Add feedback so AI knows what to change.');return;}
    setRegenerating(true);
    const updated={...asset,status:'revision_requested',feedback,revision_round:(asset.revision_round||1)+1};
    await onUpdate(updated);
    // Trigger n8n to regenerate — include reference image if provided
    try{
      await fetch(`${N8N}/webhook/regenerate-asset`,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          asset_id:asset.id,feedback,channel:asset.channel,format:asset.format,
          prompt:asset.prompt,asset_type:asset.asset_type,
          revision_round:updated.revision_round,
          reference_image:referenceImage||null
        })
      });
      setReferenceImage(null);
    }catch(e){console.error('Regeneration trigger failed:',e);}
    setRegenerating(false);
  }
  async function doRegenerateWithPrompt(){
    if(!editedPrompt.trim()){alert('Prompt is empty.');return;}
    setRegenerating(true);
    const updated={...asset,status:'revision_requested',revision_round:(asset.revision_round||1)+1};
    await onUpdate(updated);
    try{
      await fetch(`${N8N}/webhook/regenerate-asset`,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          asset_id:asset.id,prompt:editedPrompt,use_prompt_as_is:true,
          revision_round:updated.revision_round,
          feedback:'[Direct prompt edit by user]'
        })
      });
      setEditingPrompt(false);
    }catch(e){console.error('Direct regen failed:',e);}
    setRegenerating(false);
  }
  async function doRestoreVersion(rev){
    if(!rev.asset_url)return;
    if(!confirm(`Restore v${rev.revision_number}? Current image will be replaced.`))return;
    setRestoring(true);
    await onUpdate({...asset,asset_url:rev.asset_url,prompt:rev.prompt||asset.prompt,status:'pending_review'});
    setImgError(false);
    setRestoring(false);
  }
  async function doPublish(){
    await onUpdate({...asset,status:'published',published_at:now()});
  }

  async function handleManualUpload(e){
    const file=e.target.files?.[0];
    if(!file)return;
    setUploading(true);
    const ext=file.name.split('.').pop();
    const path=`${asset.campaign_id||'misc'}/${asset.channel}_${uid()}.${ext}`;
    const url=await db.uploadToStorage(file,path);
    if(url){
      const revNum=(revisions.length||0)+1;
      await db.logAssetRevision({id:uid(),asset_id:asset.id,revision_number:revNum,asset_url:url,provider:'manual_upload',feedback:'Manual upload by user',source:'manual_upload'});
      const updated={...asset,asset_url:url,provider:'manual_upload',status:'pending_review'};
      await onUpdate(updated);
      setImgError(false);
      if(historyLoaded)await loadHistory();
    }else{
      alert('Upload failed. Check Supabase Storage bucket "campaign-assets" exists and is public.');
    }
    setUploading(false);
    e.target.value='';
  }

  return html`<div style=${{background:C.s1,border:`0.5px solid ${borderColor}`,borderRadius:10,marginBottom:12,overflow:'hidden',animation:'fadeIn 0.2s ease'}}>

    <!-- Header -->
    <div style=${{padding:'11px 14px',display:'flex',justifyContent:'space-between',alignItems:'center',gap:10,borderBottom:`0.5px solid ${C.bd}`}}>
      <div style=${{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',flex:1}}>
        <span style=${{fontSize:16}}>${ch.icon}</span>
        <span style=${{fontWeight:600,fontSize:13,color:C.tx}}>${ch.label}</span>
        <span style=${{color:C.dm,fontSize:11}}>${asset.format||ch.dims}</span>
        ${asset.campaign_name?html`<span style=${{color:C.ac,fontSize:11}}>📋 ${asset.campaign_name}</span>`:''}
        <span style=${{background:C.s3,border:`0.5px solid ${C.bd}`,borderRadius:4,padding:'1px 7px',fontSize:10,color:C.mt}}>
          ${asset.provider||'ai'} · Round ${asset.revision_round||1}
        </span>
      </div>
      <${Badge} status=${asset.status} />
    </div>

    <div style=${{padding:'14px'}}>

      <!-- Asset preview -->
      <div style=${{marginBottom:12}}>
        ${asset.asset_url&&!imgError
          ?(isVideo
            ?html`<video src=${asset.asset_url} controls style=${{width:'100%',maxHeight:300,borderRadius:8,background:'#000'}}></video>`
            :html`<img src=${asset.asset_url} alt="Asset" onError=${()=>setImgError(true)}
              style=${{width:'100%',maxHeight:320,objectFit:'contain',borderRadius:8,background:C.s2,display:'block'}} />`
          )
          :html`<div style=${{background:C.s2,border:`1px dashed ${C.bd}`,borderRadius:8,padding:'40px 20px',textAlign:'center',color:C.mt}}>
            <div style=${{fontSize:32,marginBottom:8}}>${isVideo?'🎬':'🖼'}</div>
            <div style=${{fontSize:12}}>${asset.status==='generating'?'AI is generating this asset…':imgError?'Preview unavailable — asset URL may be broken':'No asset yet'}</div>
            ${asset.status==='generating'?html`<div style=${{width:24,height:24,border:`2px solid ${C.bd}`,borderTop:`2px solid ${C.ac}`,borderRadius:'50%',animation:'spin 0.8s linear infinite',margin:'12px auto 0'}}></div>`:''}
          </div>`
        }
      </div>

      <!-- Post copy (for social posts with data.topic / data.copy_body) -->
      ${asset.data?.topic?html`<div style=${{background:C.s2,borderRadius:6,padding:'10px 12px',fontSize:12,marginBottom:10,lineHeight:1.5}}>
        <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
          <span style=${{color:C.ac,fontSize:11,fontWeight:700}}>${asset.data.topic}</span>
          ${asset.data.scheduled_for?html`<span style=${{color:C.dm,fontSize:10}}>📅 ${asset.data.scheduled_for}</span>`:''}
        </div>
        ${asset.data.stat?html`<div style=${{color:C.wn,fontSize:11,fontStyle:'italic',marginBottom:6}}>📊 ${asset.data.stat}</div>`:''}
        ${asset.data.copy_body?html`<div style=${{color:C.tx,fontSize:12,lineHeight:1.6,whiteSpace:'pre-wrap'}}>${asset.data.copy_body}</div>`:''}
      </div>`:''}

      <!-- Prompt editor -->
      ${asset.prompt?html`<div style=${{background:C.s2,borderRadius:6,padding:'8px 10px',fontSize:11,color:C.dm,lineHeight:1.6,marginBottom:10}}>
        <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:editingPrompt?6:3}}>
          <span style=${{color:C.mt,fontSize:10,textTransform:'uppercase',letterSpacing:'0.5px'}}>AI Prompt</span>
          <button onClick=${()=>{setEditingPrompt(!editingPrompt);setEditedPrompt(asset.prompt||'');}}
            style=${{background:'transparent',border:`0.5px solid ${editingPrompt?C.er:C.ac}40`,borderRadius:4,color:editingPrompt?C.er:C.ac,fontSize:10,cursor:'pointer',padding:'2px 8px',transition:'all 0.15s'}}>
            ${editingPrompt?'↩ Cancel':'✏️ Edit Directly'}
          </button>
        </div>
        ${editingPrompt
          ?html`<textarea value=${editedPrompt} onInput=${e=>setEditedPrompt(e.target.value)}
              rows=5
              style=${{background:C.s3,border:`1px solid ${C.ac}`,borderRadius:4,color:C.tx,padding:'7px 9px',fontSize:11,width:'100%',resize:'vertical',outline:'none',lineHeight:1.5,marginBottom:6,boxSizing:'border-box'}}
            ></textarea>
            <button onClick=${doRegenerateWithPrompt} disabled=${regenerating}
              style=${{background:regenerating?`${C.ac}30`:C.ac,color:regenerating?C.ac:'#fff',border:'none',borderRadius:6,padding:'7px 14px',fontSize:12,fontWeight:700,cursor:regenerating?'default':'pointer',width:'100%',transition:'all 0.15s'}}>
              ${regenerating?'🤖 Generating…':'🎨 Regenerate with This Exact Prompt (no AI rewrite)'}
            </button>`
          :html`<div style=${{wordBreak:'break-word'}}>${asset.prompt}</div>`
        }
      </div>`:''}

      <!-- Manual upload override -->
      <div style=${{marginBottom:10}}>
        <input ref=${fileRef} type="file" accept=${isVideo?'video/*':'image/*'} onChange=${handleManualUpload} style=${{display:'none'}} />
        <button onClick=${()=>fileRef.current?.click()} disabled=${uploading}
          style=${{background:'transparent',border:`0.5px solid ${C.bd}`,borderRadius:6,color:uploading?C.mt:C.dm,padding:'6px 14px',fontSize:12,cursor:uploading?'default':'pointer',width:'100%',textAlign:'center'}}>
          ${uploading?'⏳ Uploading…':`📁 Upload my own ${isVideo?'video':'image'} (manual override)`}
        </button>
      </div>

      <!-- Revision history toggle -->
      <div style=${{marginBottom:10}}>
        <button onClick=${toggleHistory} style=${{background:'transparent',border:`0.5px solid ${C.bd}`,borderRadius:6,color:C.dm,padding:'5px 11px',fontSize:11,cursor:'pointer',width:'100%',textAlign:'left',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <span style=${{color:C.or}}>🕑 Version History${historyLoaded?' ('+revisions.length+')':''}</span>
          <span style=${{color:C.mt,fontSize:10}}>${showHistory?'▲ hide':'▼ show'}</span>
        </button>
        ${showHistory&&html`<div style=${{background:C.s1,border:`0.5px solid ${C.bd}`,borderTop:'none',borderRadius:'0 0 6px 6px',padding:'10px 12px'}}>
          ${!historyLoaded
            ?html`<${Spinner} msg="Loading history…"/>`
            :revisions.length===0
              ?html`<div style=${{color:C.mt,fontSize:12}}>No revisions yet.</div>`
              :revisions.map((rev,i)=>html`<div key=${i} style=${{borderBottom:i<revisions.length-1?`0.5px solid ${C.bd}`:'none',paddingBottom:10,marginBottom:10}}>
                <div style=${{display:'flex',justifyContent:'space-between',marginBottom:3}}>
                  <span style=${{color:C.ac,fontSize:11,fontWeight:600}}>v${rev.revision_number}</span>
                  <span style=${{color:C.mt,fontSize:10}}>${fmtdt(rev.created_at)}</span>
                </div>
                <div style=${{color:C.mt,fontSize:10,marginBottom:3}}>${rev.source||'ai_generated'} · ${(rev.provider||'?').split('/').pop()}</div>
                ${rev.feedback&&rev.feedback!=='[Direct prompt edit by user]'?html`<div style=${{color:C.dm,fontSize:11,fontStyle:'italic',marginBottom:4}}>"${rev.feedback}"</div>`:''}
                ${rev.prompt?html`<div style=${{color:C.mt,fontSize:10,fontStyle:'italic',marginBottom:4,wordBreak:'break-word',lineHeight:1.4}}>${rev.prompt.slice(0,100)}${rev.prompt.length>100?'…':''}</div>`:''}
                ${rev.asset_url?html`<div>
                  <img src=${rev.asset_url} style=${{width:'100%',maxHeight:120,objectFit:'contain',borderRadius:4,background:C.s2,display:'block',marginBottom:5}} />
                  <button onClick=${()=>doRestoreVersion(rev)} disabled=${restoring}

        <textarea
          placeholder="Feedback for revision (required when requesting changes)…"
          value=${feedback}
          onInput=${e=>setFeedback(e.target.value)}
          onPaste=${handleRefPaste}
          style=${{background:C.s2,border:`0.5px solid ${C.bd}`,borderRadius:6,color:C.tx,padding:'8px 11px',fontSize:12,width:'100%',resize:'vertical',minHeight:56,outline:'none',marginBottom:10,lineHeight:1.5}}
        />

        <!-- Reference image zone -->
        <input ref=${refInputRef} type="file" accept="image/*" onChange=${e=>handleRefFiles(e.target.files)} style=${{display:'none'}} />
        ${referenceImage
          ?html`<div style=${{marginBottom:10,border:`0.5px solid ${C.pu}40`,borderRadius:6,overflow:'hidden',position:'relative'}}>
            <div style=${{background:`${C.pu}15`,padding:'6px 10px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <span style=${{color:C.pu,fontSize:11,fontWeight:600}}>📎 Reference image attached</span>
              <button onClick=${()=>setReferenceImage(null)} style=${{background:'transparent',border:'none',color:C.pu,cursor:'pointer',fontSize:13,padding:'0 4px'}}>✕ Remove</button>
            </div>
            <img src=${referenceImage} style=${{width:'100%',maxHeight:180,objectFit:'contain',background:C.s2,display:'block'}} />
          </div>`
          :html`<div
            onDragOver=${e=>{e.preventDefault();setRefDragging(true);}}
            onDragLeave=${()=>setRefDragging(false)}
            onDrop=${handleRefDrop}
            onClick=${()=>refInputRef.current?.click()}
            style=${{
              border:`1px dashed ${refDragging?C.pu:C.bd}`,
              background:refDragging?`${C.pu}08`:'transparent',
              borderRadius:6,padding:'10px 14px',marginBottom:10,
              cursor:'pointer',textAlign:'center',
              transition:'border-color 0.15s, background 0.15s'
            }}>
            <span style=${{color:refDragging?C.pu:C.mt,fontSize:11}}>
              📎 Drag & drop a reference image, paste (Ctrl+V), or click to browse

        <div style=${{display:'flex',gap:8,flexWrap:'wrap'}}>
          <button onClick=${doApprove} style=${{background:C.ok,color:'#0a1a0a',border:'none',borderRadius:6,padding:'8px 18px',fontSize:13,fontWeight:700,cursor:'pointer'}}>
            ✓ Approve
          </button>
          <button onClick=${doRequestRevision} disabled=${regenerating}
            style=${{background:regenerating?`${C.pu}20`:'transparent',color:C.pu,border:`0.5px solid ${C.pu}`,borderRadius:6,padding:'8px 14px',fontSize:13,cursor:regenerating?'default':'pointer'}}>
            ${regenerating?'🤖 Regenerating…':`✏ Request AI Revision${referenceImage?' + Ref':''}`}
          </button>
          <button onClick=${doReject}
            style=${{background:'transparent',color:C.er,border:`0.5px solid ${C.er}`,borderRadius:6,padding:'8px 14px',fontSize:13,cursor:'pointer'}}>
            ✗ Reject
          </button>
        </div>
      </div>`}

      ${isApproved&&html`<div style=${{borderTop:`0.5px solid ${C.bd}`,paddingTop:12}}>
        <div style=${{color:C.ok,fontSize:11,marginBottom:10}}>✓ Approved ${fmtdt(asset.approved_at)}</div>
        <button onClick=${doPublish} style=${{background:C.tl,color:'#001a18',border:'none',borderRadius:6,padding:'8px 18px',fontSize:13,fontWeight:700,cursor:'pointer'}}>
          🚀 Mark as Published
        </button>

      ${asset.status==='published'&&html`<div style=${{color:C.tl,fontSize:11,paddingTop:8,borderTop:`0.5px solid ${C.bd}`}}>🚀 Published ${fmtdt(asset.published_at)}</div>`}

    </div>
  </div>`;
}

// ── COPY CONTENT CARD (existing, unchanged logic) ────────────
function CopyContentCard({item,onUpdate,onDelete,busy}){
  const[note,setNote]=useState(item.reviewerNotes||'');
  const[selVar,setSelVar]=useState(item.selectedVariation||0);
  const[copied,setCopied]=useState(false);
  const[editing,setEditing]=useState(false);
  const[editText,setEditText]=useState('');
  const[saving,setSaving]=useState(false);
  const[revisions,setRevisions]=useState([]);
  const[revisionsLoaded,setRevisionsLoaded]=useState(false);
  const[showHistory,setShowHistory]=useState(false);
  const[regenerating,setRegenerating]=useState(false);

  const fmt=FORMATS[item.formatId]||{icon:'📄',label:item.formatId||'Content'};
  const vars=item.copyVariations||[item.copyText||''];
  const isActionable=['pending_review','revision_requested'].includes(item.status);
  const isApproved=item.status==='approved';
  const SOURCE_STYLE={human_edit:{c:C.ac,l:'Human Edit'},claude_regeneration:{c:C.pu,l:'AI Regen'},original:{c:C.dm,l:'Original'},restored:{c:C.tl,l:'Restored'}};
  const borderColor=item.status==='pending_review'?C.bdB:item.status==='approved'?C.ok+'50':item.status==='revision_requested'?C.pu+'50':C.bd;

  async function loadRevisions(){const r=await db.getRevisions(item.id);setRevisions(r);setRevisionsLoaded(true);}
  async function toggleHistory(){const next=!showHistory;setShowHistory(next);if(next&&!revisionsLoaded)await loadRevisions();}
  async function selectVar(i){setSelVar(i);await onUpdate({...item,selectedVariation:i,updatedAt:now()});}
  function startEdit(){setEditText(vars[selVar]||'');setEditing(true);}
  function cancelEdit(){setEditing(false);}

  async function saveEdit(){
    const trimmed=editText.trim();
    if(!trimmed||trimmed===vars[selVar]){setEditing(false);return;}
    setSaving(true);
    const newVars=[...vars];newVars[selVar]=trimmed;
    const updated={...item,copyVariations:newVars,updatedAt:now()};
    const vNum=revisionsLoaded?revisions.length+1:1;
    await db.logRevision({id:uid(),queue_item_id:item.id,client_id:item.clientId||null,campaign_id:item.campaignId||null,asset_type:'copy',format_id:item.formatId,variant_label:varLabel(selVar),version_number:vNum,content:trimmed,source:'human_edit',revision_notes:note||null,status:'active',created_by:'Jason',data:updated});
    await onUpdate(updated);
    const r=await db.getRevisions(item.id);setRevisions(r);setRevisionsLoaded(true);
    setSaving(false);setEditing(false);
  }

  async function restoreRevision(rev){
    const idx=Math.max(0,'ABCDEFGHIJ'.indexOf(rev.variant_label||'A'));
    const newVars=[...vars];newVars[idx]=rev.content;
    const updated={...item,copyVariations:newVars,updatedAt:now()};
    await db.logRevision({id:uid(),queue_item_id:item.id,client_id:item.clientId||null,campaign_id:item.campaignId||null,asset_type:'copy',format_id:item.formatId,variant_label:rev.variant_label||varLabel(idx),version_number:revisions.length+1,content:rev.content,source:'human_edit',revision_notes:`Restored from v${rev.version_number}`,status:'restored',created_by:'Jason',data:updated});
    await onUpdate(updated);
    const r=await db.getRevisions(item.id);setRevisions(r);
  }

  async function doApprove(){await onUpdate({...item,status:'approved',selectedVariation:selVar,approvedAt:now(),updatedAt:now(),reviewerNotes:note||null});}
  async function doRevision(){
    if(!note.trim()){alert('Add revision notes — Claude will use these to regenerate the copy.');return;}
    setRegenerating(true);
    await onUpdate({...item,status:'revision_requested',reviewerNotes:note,updatedAt:now()});
    const sys=`You are an expert marketing copywriter for ${item.clientName||'the brand'}. You are revising existing marketing copy based on reviewer feedback.`;
    const usr=`Revise the following ${item.formatLabel||item.formatId} copy based on the revision notes below.\n\nOriginal brief: ${item.brief||'Not specified'}\nLanguage: ${item.language||'English'}\nTone: ${item.tone||'Use brand voice'}\n\nCurrent copy:\n${vars[selVar]||''}\n\nRevision notes from reviewer: ${note}\n\nWrite ONLY the revised copy. No preamble, no explanation, no labels. Output the copy directly.`;
    try{
      const res=await fetch(`${N8N}/webhook/claude-proxy`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system:sys,prompt:usr})});
      const rawText=await res.text();
      if(!rawText||rawText.trim()===''){throw new Error('n8n returned empty response');}
      let data;try{data=JSON.parse(rawText);}catch{throw new Error('Invalid response: '+rawText.slice(0,120));}
      const newText=(data?.content?.[0]?.text||data?.[0]?.content?.[0]?.text||data?.body?.content?.[0]?.text||'').trim();
      if(newText){
        const newVars=[...vars];newVars[selVar]=newText;
        const vNum=revisionsLoaded?revisions.length+1:1;
        await db.logRevision({id:uid(),queue_item_id:item.id,client_id:item.clientId||null,campaign_id:item.campaignId||null,asset_type:'copy',format_id:item.formatId,variant_label:varLabel(selVar),version_number:vNum,content:newText,source:'claude_regeneration',revision_notes:note,status:'active',created_by:'Claude',data:{...item,copyVariations:newVars}});
        const updated={...item,copyVariations:newVars,status:'pending_review',reviewerNotes:note,updatedAt:now()};
        await onUpdate(updated);
        const r=await db.getRevisions(item.id);setRevisions(r);setRevisionsLoaded(true);
        setNote('');
      }else{alert('Claude returned empty response. Notes saved — try again.');}
    }catch(e){alert('Regeneration failed: '+e.message);}
    setRegenerating(false);
  }
  async function doReject(){await onUpdate({...item,status:'rejected',reviewerNotes:note||null,updatedAt:now()});}
  async function doPublish(){await onUpdate({...item,status:'published',publishedAt:now(),updatedAt:now()});}
  async function copyText(){try{await navigator.clipboard.writeText(vars[selVar]||'');setCopied(true);setTimeout(()=>setCopied(false),2000);}catch{window.prompt('Copy this text:',vars[selVar]||'');}}

  return html`<div style=${{background:C.s1,border:`0.5px solid ${borderColor}`,borderRadius:10,marginBottom:12,overflow:'hidden',animation:'fadeIn 0.2s ease'}}>
    <div style=${{padding:'13px 16px',display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:12,borderBottom:`0.5px solid ${C.bd}`}}>
      <div style=${{flex:1,minWidth:0}}>
        <div style=${{display:'flex',alignItems:'center',gap:7,flexWrap:'wrap',marginBottom:4}}>
          <span style=${{fontSize:15}}>${fmt.icon}</span>
          <span style=${{fontWeight:600,fontSize:14,color:C.tx}}>${item.clientName||'Unknown Client'}</span>
          <span style=${{color:C.dm,fontSize:12}}>${fmt.label}</span>
          ${item.campaignName?html`<span style=${{color:C.ac,fontSize:11}}>📋 ${item.campaignName}</span>`:''}
        </div>
        <div style=${{color:C.mt,fontSize:11}}>Submitted ${fmtdt(item.createdAt)} · ${vars.length} variation${vars.length!==1?'s':''}</div>
      </div>
      <div style=${{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:6,flexShrink:0}}>
        <${Badge} status=${item.status} />
        <button onClick=${()=>onDelete(item.id)} style=${{background:'transparent',border:'none',color:C.mt,cursor:'pointer',fontSize:12,padding:'1px 4px'}} title="Delete">✕</button>
      </div>
    </div>

    ${item.brief?html`<div style=${{padding:'8px 16px',background:C.s2+'60',borderBottom:`0.5px solid ${C.bd}`,fontSize:12,color:C.dm,lineHeight:1.5}}>
      <span style=${{color:C.mt,fontSize:10,textTransform:'uppercase',letterSpacing:'0.5px',marginRight:6}}>Brief</span>${item.brief}
    </div>`:''}

    <div style=${{padding:'14px 16px'}}>
      ${vars.length>1?html`<div style=${{display:'flex',gap:6,flexWrap:'wrap',marginBottom:10}}>
        ${vars.map((v,i)=>html`<button key=${i} onClick=${()=>selectVar(i)} style=${{background:selVar===i?C.ac:C.s3,color:selVar===i?'#fff':C.dm,border:`0.5px solid ${selVar===i?C.ac:C.bd}`,borderRadius:5,padding:'4px 11px',fontSize:11,cursor:'pointer'}}>
          Var ${varLabel(i)}${selVar===i?' ✓':''}
        </button>`)}
      </div>`:''}

      ${editing
        ?html`<div>
          <textarea value=${editText} onInput=${e=>setEditText(e.target.value)} autoFocus
            style=${{background:C.s2,border:`1px solid ${C.ac}`,borderRadius:8,padding:'12px 14px',fontSize:13,lineHeight:1.75,color:C.tx,width:'100%',resize:'vertical',minHeight:160,outline:'none'}}/>
          <div style=${{display:'flex',gap:7,marginTop:7,justifyContent:'flex-end'}}>
            <button onClick=${cancelEdit} style=${{background:'transparent',border:`0.5px solid ${C.bd}`,borderRadius:5,color:C.dm,padding:'5px 13px',fontSize:12,cursor:'pointer'}}>Cancel</button>
            <button onClick=${saveEdit} disabled=${saving} style=${{background:C.ac,border:'none',borderRadius:5,color:'#fff',padding:'5px 16px',fontSize:12,fontWeight:600,cursor:saving?'default':'pointer',opacity:saving?0.6:1}}>${saving?'Saving…':'Save Edit'}</button>
          </div>
        </div>`
        :html`<div>
          <div style=${{background:C.s2,border:`0.5px solid ${isApproved?C.ok+'50':C.bd}`,borderRadius:8,padding:'12px 14px',fontSize:13,lineHeight:1.75,color:C.tx,whiteSpace:'pre-wrap',maxHeight:220,overflowY:'auto'}}>
            ${vars[selVar]||'No copy generated'}
          </div>
          <div style=${{display:'flex',justifyContent:'flex-end',gap:7,marginTop:6}}>
            <button onClick=${copyText} style=${{background:'transparent',border:`0.5px solid ${C.bd}`,borderRadius:5,color:copied?C.ok:C.dm,padding:'4px 10px',fontSize:11,cursor:'pointer'}}>${copied?'✓ Copied':'Copy text'}</button>
            <button onClick=${startEdit} style=${{background:'transparent',border:`0.5px solid ${C.bdB}`,borderRadius:5,color:C.dm,padding:'4px 10px',fontSize:11,cursor:'pointer'}}>✏ Edit copy</button>
          </div>
        </div>`
      }

      <div style=${{marginTop:8}}>
        <button onClick=${toggleHistory} style=${{background:'transparent',border:`0.5px solid ${C.bd}`,borderRadius:6,color:C.dm,padding:'5px 11px',fontSize:11,cursor:'pointer',width:'100%',textAlign:'left',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <span style=${{color:C.or}}>🕑 Revision History${revisionsLoaded?' ('+revisions.length+')':''}</span>
          <span style=${{color:C.mt,fontSize:10}}>${showHistory?'▲ hide':'▼ show'}</span>
        </button>
        ${showHistory&&html`<div style=${{background:C.s1,border:`0.5px solid ${C.bd}`,borderTop:'none',borderRadius:'0 0 6px 6px',padding:'10px 12px',animation:'fadeIn 0.15s ease'}}>
          ${!revisionsLoaded
            ?html`<div style=${{color:C.dm,fontSize:12,padding:'8px 0'}}>Loading…</div>`
            :revisions.length===0
              ?html`<div style=${{color:C.mt,fontSize:12,padding:'8px 0'}}>No edits logged yet.</div>`
              :revisions.map((rev,i)=>{
                  const src=SOURCE_STYLE[rev.source]||{c:C.dm,l:rev.source||'Edit'};
                  return html`<div key=${i} style=${{borderBottom:i<revisions.length-1?`0.5px solid ${C.bd}`:'none',paddingBottom:10,marginBottom:10}}>
                    <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4,flexWrap:'wrap',gap:4}}>
                      <div style=${{display:'flex',gap:6,alignItems:'center'}}>
                        <span style=${{background:`${src.c}20`,color:src.c,border:`0.5px solid ${src.c}40`,borderRadius:10,padding:'1px 7px',fontSize:10,fontWeight:600}}>${src.l}</span>
                        <span style=${{color:C.mt,fontSize:10}}>Var ${rev.variant_label||'A'} · v${rev.version_number}</span>
                      </div>
                      <span style=${{color:C.mt,fontSize:10}}>${fmtdt(rev.created_at)}</span>
                    </div>
                    ${rev.revision_notes?html`<div style=${{color:C.dm,fontSize:11,marginBottom:5,fontStyle:'italic'}}>"${rev.revision_notes}"</div>`:''}
                    <div style=${{color:C.tx,fontSize:12,lineHeight:1.6,background:C.s2,borderRadius:6,padding:'6px 9px',whiteSpace:'pre-wrap',maxHeight:80,overflowY:'auto',marginBottom:5}}>
                      ${(rev.content||'').slice(0,300)}${(rev.content||'').length>300?'…':''}
                    </div>
                    <button onClick=${()=>restoreRevision(rev)} style=${{background:'transparent',border:`0.5px solid ${C.bd}`,borderRadius:4,color:C.dm,padding:'3px 9px',fontSize:10,cursor:'pointer'}}>↩ Restore this version</button>
                  </div>`;
                })
          }
        </div>`}
      </div>

      ${isActionable?html`<div style=${{marginTop:14,paddingTop:14,borderTop:`0.5px solid ${C.bd}`}}>
        <textarea placeholder="Revision notes (required for revision requests)…" value=${note} onInput=${e=>setNote(e.target.value)}
          style=${{background:C.s2,border:`0.5px solid ${C.bd}`,borderRadius:6,color:C.tx,padding:'8px 11px',fontSize:12,width:'100%',resize:'vertical',minHeight:64,outline:'none',marginBottom:10,lineHeight:1.5}}/>
        <div style=${{display:'flex',gap:8,flexWrap:'wrap'}}>
          <button onClick=${doApprove} disabled=${busy} style=${{background:C.ok,color:'#0a1a0a',border:'none',borderRadius:6,padding:'8px 20px',fontSize:13,fontWeight:700,cursor:busy?'default':'pointer',opacity:busy?0.6:1}}>✓ Approve</button>
          <button onClick=${doRevision} disabled=${busy||regenerating} style=${{background:regenerating?`${C.pu}20`:'transparent',color:C.pu,border:`0.5px solid ${C.pu}`,borderRadius:6,padding:'8px 15px',fontSize:13,cursor:(busy||regenerating)?'default':'pointer',opacity:(busy||regenerating)?0.8:1}}>
            ${regenerating?'🤖 Rewriting…':'✏ Request Revision'}
          </button>
          <button onClick=${doReject} disabled=${busy} style=${{background:'transparent',color:C.er,border:`0.5px solid ${C.er}`,borderRadius:6,padding:'8px 15px',fontSize:13,cursor:busy?'default':'pointer',opacity:busy?0.6:1}}>✗ Reject</button>
        </div>
      </div>`:''}

      ${isApproved?html`<div style=${{marginTop:14,paddingTop:14,borderTop:`0.5px solid ${C.bd}`}}>
        <button onClick=${doPublish} disabled=${busy} style=${{background:C.tl,color:'#001a18',border:'none',borderRadius:6,padding:'8px 20px',fontSize:13,fontWeight:700,cursor:busy?'default':'pointer',opacity:busy?0.6:1}}>🚀 Mark as Published</button>
      </div>`:''}
      ${item.status==='published'?html`<div style=${{color:C.tl,fontSize:11,marginTop:10}}>🚀 Published ${fmtdt(item.publishedAt)}</div>`:''}
    </div>
  </div>`;
}

// ── MAIN APP ─────────────────────────────────────────────────
function App(){
  const[activeTab,setActiveTab]=useState('copy');
  const[copyItems,setCopyItems]=useState([]);
  const[mediaAssets,setMediaAssets]=useState([]);
  const[clients,setClients]=useState([]);
  const[loading,setLoading]=useState(true);
  const[busy,setBusy]=useState({});
  const[filterStatus,setFilterStatus]=useState('pending_review');
  const[filterClient,setFilterClient]=useState('all');
  const[lastRefresh,setLastRefresh]=useState(null);

  const loadData=useCallback(async(silent=false)=>{
    if(!silent)setLoading(true);
    const[q,c,m]=await Promise.all([db.getQueue(),db.getClients(),db.getMediaAssets()]);
    setCopyItems(q);setClients(c);setMediaAssets(m);
    setLastRefresh(new Date());
    if(!silent)setLoading(false);
  },[]);

  useEffect(()=>{loadData();},[loadData]);
  useEffect(()=>{const t=setInterval(()=>loadData(true),60000);return()=>clearInterval(t);},[loadData]);

  async function handleCopyUpdate(item){
    setBusy(p=>({...p,[item.id]:true}));
    await db.updateItem(item);
    setCopyItems(prev=>prev.map(i=>i.id===item.id?item:i));
    setBusy(p=>({...p,[item.id]:false}));
  }
  async function handleCopyDelete(id){
    if(!confirm('Remove this item from the queue?'))return;
    await db.deleteItem(id);
    setCopyItems(prev=>prev.filter(i=>i.id!==id));
  }
  async function handleAssetUpdate(asset){
    await db.updateAsset(asset);
    // Sync status to content_approvals for real_gains series
    if(['approved','rejected','revision_requested'].includes(asset.status)){
      await db.syncContentApproval(asset.id, asset.status);
    }
    setMediaAssets(prev=>prev.map(a=>a.id===asset.id?asset:a));
  }

  // Stats
  const copyCounts={all:copyItems.length};
  Object.keys(STATUS).forEach(s=>{copyCounts[s]=copyItems.filter(i=>i.status===s).length;});
  const mediaCounts={all:mediaAssets.length};
  Object.keys(STATUS).forEach(s=>{mediaCounts[s]=mediaAssets.filter(a=>a.status===s).length;});

  const filteredCopy=copyItems.filter(item=>{
    if(filterStatus!=='all'&&item.status!==filterStatus)return false;
    if(filterClient!=='all'&&item.clientId!==filterClient)return false;
    return true;
  });
  const filteredMedia=mediaAssets.filter(asset=>{
    if(filterStatus!=='all'&&asset.status!==filterStatus)return false;
    if(filterClient!=='all'&&asset.client_id!==filterClient)return false;
    return true;
  });

  const counts=activeTab==='copy'?copyCounts:mediaCounts;
  const statusTabs=[
    {k:'all',l:'All'},{k:'pending_review',l:'Pending'},{k:'revision_requested',l:'Revision Needed'},
    {k:'approved',l:'Approved'},{k:'rejected',l:'Rejected'},{k:'published',l:'Published'},
  ];

  const pendingCopy=copyCounts['pending_review']||0;
  const pendingMedia=mediaCounts['pending_review']||0;

  return html`<div style=${{minHeight:'100vh',background:C.bg}}>

    <!-- Header -->
    <div style=${{background:C.s1,borderBottom:`0.5px solid ${C.bd}`,padding:'0 20px',position:'sticky',top:0,zIndex:100}}>
      <div style=${{maxWidth:1100,margin:'0 auto',display:'flex',justifyContent:'space-between',alignItems:'center',height:52}}>
        <div style=${{display:'flex',alignItems:'center',gap:10}}>
          <span style=${{fontSize:17,fontWeight:700,color:C.tx,letterSpacing:'-0.3px'}}>OmniraAI</span>
          <span style=${{color:C.bd}}>·</span>
          <span style=${{fontSize:13,color:C.dm}}>Content Approval</span>
        </div>
        <div style=${{display:'flex',alignItems:'center',gap:10}}>
          ${lastRefresh?html`<span style=${{fontSize:11,color:C.mt}}>Updated ${fmtdt(lastRefresh)}</span>`:''}
          <button onClick=${()=>loadData()} disabled=${loading} style=${{background:'transparent',border:`0.5px solid ${C.bd}`,borderRadius:6,color:C.dm,padding:'5px 13px',fontSize:12,cursor:'pointer',opacity:loading?0.5:1}}>
            ${loading?'…':'↻ Refresh'}
          </button>
        </div>
      </div>
    </div>

    <div style=${{maxWidth:1100,margin:'0 auto',padding:'20px'}}>

      <!-- Tab switcher -->
      <div style=${{display:'flex',gap:8,marginBottom:20}}>
        <button onClick=${()=>setActiveTab('copy')} style=${{background:activeTab==='copy'?C.ac:C.s1,color:activeTab==='copy'?'#fff':C.dm,border:`0.5px solid ${activeTab==='copy'?C.ac:C.bd}`,borderRadius:8,padding:'9px 20px',fontSize:14,fontWeight:600,cursor:'pointer',position:'relative'}}>
          📝 Copy
          ${pendingCopy>0?html`<span style=${{position:'absolute',top:-6,right:-6,background:C.wn,color:'#0a0a00',borderRadius:10,padding:'1px 6px',fontSize:10,fontWeight:700}}>${pendingCopy}</span>`:''}
        </button>
        <button onClick=${()=>setActiveTab('media')} style=${{background:activeTab==='media'?C.pu:C.s1,color:activeTab==='media'?'#fff':C.dm,border:`0.5px solid ${activeTab==='media'?C.pu:C.bd}`,borderRadius:8,padding:'9px 20px',fontSize:14,fontWeight:600,cursor:'pointer',position:'relative'}}>
          🖼 Media Assets
          ${pendingMedia>0?html`<span style=${{position:'absolute',top:-6,right:-6,background:C.wn,color:'#0a0a00',borderRadius:10,padding:'1px 6px',fontSize:10,fontWeight:700}}>${pendingMedia}</span>`:''}
        </button>
      </div>

      <!-- Stats row -->
      <div style=${{display:'flex',gap:10,marginBottom:20,flexWrap:'wrap'}}>
        ${Object.entries(STATUS).map(([k,cfg])=>html`<div key=${k} style=${{background:C.s1,border:`0.5px solid ${counts[k]>0?cfg.c+'50':C.bd}`,borderRadius:8,padding:'10px 16px',textAlign:'center',minWidth:100,flex:1}}>
          <div style=${{fontSize:22,fontWeight:700,color:counts[k]>0?cfg.c:C.mt}}>${counts[k]||0}</div>
          <div style=${{fontSize:10,color:C.dm,textTransform:'uppercase',letterSpacing:'0.5px',marginTop:2,lineHeight:1.3}}>${cfg.l}</div>
        </div>`)}
      </div>

      <!-- Filters -->
      <div style=${{background:C.s1,border:`0.5px solid ${C.bd}`,borderRadius:10,padding:'14px 16px',marginBottom:20}}>
        <div style=${{display:'flex',gap:6,flexWrap:'wrap',marginBottom:10}}>
          ${statusTabs.map(({k,l})=>html`<button key=${k} onClick=${()=>setFilterStatus(k)}
            style=${{background:filterStatus===k?(activeTab==='copy'?C.ac:C.pu):C.s3,color:filterStatus===k?'#fff':C.dm,border:`0.5px solid ${filterStatus===k?(activeTab==='copy'?C.ac:C.pu):C.bd}`,borderRadius:6,padding:'5px 13px',fontSize:12,cursor:'pointer'}}>
            ${l} (${counts[k]||0})
          </button>`)}
        </div>
        <select value=${filterClient} onChange=${e=>setFilterClient(e.target.value)}
          style=${{background:C.s2,border:`0.5px solid ${C.bd}`,borderRadius:6,color:C.tx,padding:'6px 10px',fontSize:12,minWidth:180,outline:'none'}}>
          <option value="all">All Clients</option>
          ${clients.map(c=>html`<option key=${c.id} value=${c.id}>${c.basics?.brandName||c.basics?.clientName||c.id}</option>`)}
        </select>
      </div>

      <!-- Content -->
      ${loading
        ?html`<${Spinner}/>`
        :activeTab==='copy'
          ?(filteredCopy.length===0
            ?html`<div style=${{textAlign:'center',padding:'80px 20px',color:C.mt}}>
              <div style=${{fontSize:32,marginBottom:12}}>${copyItems.length===0?'📭':'🔍'}</div>
              <div style=${{fontSize:14}}>${copyItems.length===0?'Copy queue is empty':'No copy matches current filters'}</div>
            </div>`
            :filteredCopy.map(item=>html`<${CopyContentCard} key=${item.id} item=${item} onUpdate=${handleCopyUpdate} onDelete=${handleCopyDelete} busy=${!!busy[item.id]} />`))
          :(filteredMedia.length===0
            ?html`<div style=${{textAlign:'center',padding:'80px 20px',color:C.mt}}>
              <div style=${{fontSize:32,marginBottom:12}}>${mediaAssets.length===0?'🖼':'🔍'}</div>
              <div style=${{fontSize:14,marginBottom:8}}>${mediaAssets.length===0?'No media assets yet':'No assets match current filters'}</div>
              ${mediaAssets.length===0?html`<div style=${{fontSize:12,color:C.bd,maxWidth:400,margin:'0 auto',lineHeight:1.6}}>
                Media assets will appear here once a campaign brief triggers the AI generation pipeline.<br/>
                Add your Fal.ai API key in Supabase settings to enable automatic generation.
              </div>`:''}
            </div>`
            :html`<div style=${{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(340px,1fr))',gap:16}}>
              ${filteredMedia.map(asset=>html`<${MediaAssetCard} key=${asset.id} asset=${asset} onUpdate=${handleAssetUpdate} />`)}
            </div>`)
      }
    </div>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
